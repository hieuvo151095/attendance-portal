<script>
const LIVE=false;let DATA={"meta": {"name": "Attendance Portal", "mode": "new", "pages": 26, "notes": 30, "links": 171, "gaps": {"gap": {"MISSING": 43}}, "open": 3, "generated": "2026-11-02 17:10", "bodies": true}, "nodes": [{"path": "OBSIDIAN.md", "title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "group": "root", "fm": {"title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "sources": ["SCHEMA.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Mở wiki bằng Obsidian để xem graph\n\nThư mục `llm-wiki/` là một **Obsidian vault** đã cấu hình sẵn trong `.obsidian/`. Trong mẫu LLM Wiki, vai trò được chia như sau: Obsidian là IDE, LLM là lập trình viên, còn wiki là codebase.\n\n## Tóm tắt\n\n1. Cài Obsidian: `brew install --cask obsidian` (macOS), hoặc tải từ obsidian.md.\n2. Mở vault: Obsidian → **Open folder as vault** → chọn `Attendance Portal/llm-wiki`.\n3. Xem graph: `Cmd+G`. Mở một trang rồi chạy **Open local graph** để xem các trang quanh nó.\n\n## Bản đồ\n\n| Màu node | Nhóm | Thư mục |\n|---|---|---|\n| Đỏ cam | Tổng quan | `pages/overview/` |\n| Cam | Luồng nghiệp vụ | `pages/flows/` |\n| Xanh dương | Màn hình | `pages/screens/` |\n| Xanh lá | Thực thể | `pages/entities/` |\n| Tím | Khái niệm | `pages/concepts/` |\n| Xám | Nguồn đã ingest | `pages/sources/` |\n| Xám nhạt | Nguồn thô | `raw/` |\n| Đen | Điều hướng | `index.md`, `log.md`, `SCHEMA.md`, file này |\n\nCấu hình đặt sẵn:\n- Dùng link markdown tương đối, không dùng `[[wikilink]]`, khớp SCHEMA §4.3.\n- Trang mới tạo vào `pages/`; ảnh dán vào lưu ở `raw/assets/`.\n- Graph ẩn thư mục `tools/`, ẩn file đính kèm và link chưa có đích.\n- `workspace.json` (bố cục cửa sổ cá nhân) bị git bỏ qua. Các file cấu hình còn lại được commit, để cả nhóm thấy cùng một graph.\n\n## Quy tắc khi sửa trong Obsidian\n\n- Wiki do LLM sở hữu. Bạn ghi chú được, nhưng nên nhờ LLM ingest để `index.md`, `log.md` và các liên kết được cập nhật đồng bộ (SCHEMA §6).\n- **Không sửa `raw/`.**\n- Sau khi sửa tay, chạy lint: `python3 -I tools/lint_wiki.py .`\n\n## Liên quan\n\n- [Danh mục wiki](index.md)\n- [SCHEMA](SCHEMA.md)\n"}, {"path": "SCHEMA.md", "title": "SCHEMA — LLM Wiki của dự án Attendance Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 3, "body": "# SCHEMA — LLM Wiki của dự án Attendance Portal\n\n> Đây là bản thể hiện của mẫu \"LLM Wiki\" (Karpathy, gist `karpathy/442a6bf555914893e9891c11519de94f`) cho repo này. Wiki được dựng bằng skill `llm-wiki`, chế độ **new**.\n> File này là **cấu hình**: nó cho mọi agent LLM biết wiki có cấu trúc ra sao, quy ước viết trang và quy trình Ingest / Query / Lint. Bản máy đọc nằm ở `wiki.json`; `tools/lint_wiki.py` đọc file đó.\n> Người và LLM cùng chỉnh file này theo thời gian. Ngày khởi tạo: 2026-11-02.\n\n## 1. Mục đích\n\n- `llm-wiki/pages/` là **đặc tả (spec) và tài liệu sống** của những gì Attendance Portal PHẢI làm. Wiki tổng hợp từ nguồn nghiệp vụ (tài liệu BA, PRD, spec sheet, quyết định của chủ sở hữu).\n- Tính năng mới được đặc tả ở đây trước, rồi mới vào backlog của harness. Harness trỏ `sources.spec.root` vào `llm-wiki/pages/`.\n\n- Dự án **mới**: chưa có code, hoặc code mới bắt đầu. Phần thân trang mô tả hành vi **mong muốn** đã được chủ sở hữu duyệt, ghi rõ nguồn quyết định.\n- Bảng `## Khác biệt spec ↔ code` đóng vai trò **bảng theo dõi triển khai**. Ban đầu mọi mã là `MISSING`; khi code xong và verify xanh thì chuyển sang `OK`, kèm bằng chứng `repo:path:line`.\n\n- Ngôn ngữ: **tiếng Việt**. Giữ nguyên tên định danh: page id, tên file code, tên trường, enum, tên package.\n\n## 2. Ba lớp\n\n| Lớp | Đường dẫn | Ai sở hữu | Quy tắc |\n|---|---|---|---|\n| Nguồn thô (raw) | `llm-wiki/raw/` | Người dùng | **Bất biến.** LLM chỉ đọc, không sửa. Thêm nguồn mới thì thêm file mới. |\n| Wiki | `llm-wiki/pages/` | LLM | LLM tạo và sửa toàn bộ. Người đọc và góp ý. |\n| Schema | `llm-wiki/SCHEMA.md` + `wiki.json` | Người + LLM | Chỉ sửa khi đã thống nhất quy ước mới, và ghi lại thay đổi trong `log.md`. |\n\nTệp điều hướng: `llm-wiki/index.md` là danh mục theo nội dung; `llm-wiki/log.md` là nhật ký theo thời gian, chỉ ghi thêm.\n\n**Vault độc lập:** `llm-wiki/` là một Obsidian vault riêng, chỉ chứa tri thức của Attendance Portal. Không liên kết, không copy trang, không dùng chung `.obsidian/` với wiki của dự án khác. Chỉ được mượn **khuôn** (schema, tools), không mượn **nội dung**. Mọi link phải trỏ vào bên trong `llm-wiki/`, hoặc dùng tiền tố `repo:` cho file của repo này.\n\n## 3. Cấu trúc thư mục\n\n```\nllm-wiki/\n├── SCHEMA.md     ← file này\n├── wiki.json     ← cấu hình máy đọc: chế độ, tiền tố mã spec, mục bắt buộc\n├── OBSIDIAN.md   ← cách mở vault và xem graph\n├── index.md      ← danh mục mọi trang (LLM cập nhật mỗi lần ingest)\n├── log.md        ← nhật ký append-only (ingest | query | lint | decide)\n├── tools/        ← lint_wiki.py, obsidian_graph.py\n├── raw/          ← nguồn bất biến KHÔNG nằm sẵn trong repo\n│   ├── specs/    ← spreadsheet / tài liệu yêu cầu (bản gốc + export nguyên văn)\n│   └── assets/   ← ảnh dán vào từ Obsidian\n└── pages/        ← wiki do LLM sở hữu (= spec root của harness)\n    ├── overview/ ← type: overview — bức tranh tổng, hub từng phân hệ, phân quyền\n    ├── sources/  ← type: source   — tóm tắt từng nguồn đã ingest, trang quyết định\n    ├── entities/ ← type: entity   — đối tượng nghiệp vụ\n    ├── concepts/ ← type: concept  — quy tắc hoặc khái niệm xuyên phân hệ\n    ├── flows/    ← type: flow     — luồng nghiệp vụ nhiều bước\n    └── screens/  ← type: screen   — màn hình / route; ánh xạ spec → route trong code\n```\n\nKhi code bắt đầu có, tham chiếu bằng tiền tố `repo:`, ví dụ `repo:src/orders/service.ts:42`. Không copy code vào `raw/`.\n\n## 4. Quy ước trang\n\n### 4.1 Frontmatter YAML (bắt buộc)\n\n```yaml\n---\ntitle: Đơn hàng                 # tên hiển thị\ntype: entity                    # overview | source | entity | concept | flow | screen\nsources:                        # nguồn căn cứ: đường dẫn tương đối từ llm-wiki/ hoặc repo:<path>\n  - raw/specs/01-yeu-cau.md\nupdated: 2026-11-02               # ngày LLM sửa gần nhất (YYYY-MM-DD)\n---\n```\n\nTrường tuỳ chọn:\n- `spec_ids`: danh sách mã yêu cầu, xem §5.\n- `apps`: các app liên quan.\n- `route_ids`: chỉ cho `screen`.\n- `status` (`implemented | partial | missing | extra`): chỉ cho `screen`.\n- `aliases`.\n\n### 4.2 Đặt tên file\n\n- Tên file: **tiếng Anh**, `kebab-case`, ngắn và gợi tả, ví dụ `sales-order.md`, `outlet-debt.md`, `order-list.md`. Tiêu đề (`title:`) viết bằng ngôn ngữ của wiki.\n- File dẫn hướng có tên cố định: `pages/overview/project-overview.md` (tổng quan), `pages/overview/module-<tên>.md` (hub từng phân hệ), `pages/sources/<module>-decisions-YYYY-MM-DD.md` (quyết định).\n- Một khái niệm là một trang. Trước khi tạo trang mới, tìm trong `index.md` xem đã có chưa.\n- Đặt tên screen theo nghiệp vụ, không theo tên component.\n- Mỗi trang tối đa 600 dòng; dài hơn thì tách thành trang con.\n\n### 4.3 Liên kết\n\n- Dùng **link markdown tương đối**, ví dụ `[Đơn hàng](../entities/sales-order.md)`. Không dùng wikilink `[[...]]`, để file hiển thị đúng trên GitHub/GitLab và để harness đọc được.\n  - Ngoại lệ duy nhất: block `<!-- ai-po:<FID> begin … end -->` do harness (AI PO) chèn vào trang spec dùng `[[proposals/ai-po-<FID>.md]]`, đường dẫn tính từ `pages/`. Đó là vùng của harness: không sửa tay bên trong; muốn lật quyết định thì xoá cả block. Lint chấp nhận block này nhưng vẫn kiểm bản ghi có tồn tại.\n- Mỗi trang phải có ít nhất **một liên kết đến** từ trang khác. Trang tổng quan `overview/project-overview.md` được miễn quy tắc này.\n- Trang `source` kết thúc bằng mục `## Trang chịu ảnh hưởng`; mọi loại trang còn lại kết thúc bằng `## Liên quan`.\n\n### 4.4 Mục bắt buộc theo loại\n\n| type | Mục bắt buộc (theo thứ tự) |\n|---|---|\n| `overview` | Tóm tắt · Bản đồ · Liên quan |\n| `source` | Thông tin nguồn · Nội dung chính · Mã yêu cầu được định nghĩa (nếu là spec) · Điểm đáng chú ý / mâu thuẫn · Trang chịu ảnh hưởng |\n| `entity` | Định nghĩa · Thuộc tính / quy tắc nghiệp vụ (kèm mã spec) · Quan hệ · Khác biệt spec ↔ code · Liên quan |\n| `concept` | Định nghĩa · Quy tắc · Áp dụng ở đâu · Khác biệt spec ↔ code · Liên quan |\n| `flow` | Mục tiêu · Các bước (có vai trò và app) · Quy tắc chặn / validation · Khác biệt spec ↔ code · Liên quan |\n| `screen` | Mục đích · App / route / file code · Yêu cầu spec · Khác biệt spec ↔ code · Câu hỏi mở (nếu có) · Liên quan |\n\nMẫu từng loại trang: `references/page-templates.vi.md` của skill `llm-wiki`.\n\n### 4.5 Mục `## Khác biệt spec ↔ code`\n\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n\nCột `Mức` nhận một trong các giá trị:\n- `MISSING`: chưa có.\n- `PARTIAL`: có một phần.\n- `CONTRADICTS`: làm khác spec.\n- `BUG`: định làm đúng nhưng lỗi.\n- `EXTRA`: code có, spec không yêu cầu.\n- `OK`: khớp spec.\n\nCột `Bằng chứng` ghi `repo:path:line` theo snapshot của ngày trong `updated`. Số dòng có thể trôi, nên lint kiểm lại. Với mức `MISSING` khi chưa có code, bằng chứng ghi `—`.\n\n### 4.7 Đánh dấu chưa rõ\n\n- Chỗ spec mơ hồ hoặc tự mâu thuẫn: ghi `**[CẦN LÀM RÕ]**` kèm mô tả, và liệt kê trong mục `## Câu hỏi mở`.\n- Không tự bịa quy tắc nghiệp vụ.\n\n## 5. Mã yêu cầu (spec IDs) và thứ tự ưu tiên nguồn\n\nMỗi phân hệ có một tiền tố; mã có dạng `PREFIX-NN`, tăng dần và không tái dùng số. Một mã là một quy tắc nghiệp vụ kiểm được.\n- Mã được định nghĩa trong trang source chính của phân hệ, ở mục \"Mã yêu cầu được định nghĩa\".\n- Trang nào dùng mã thì ghi mã đó vào frontmatter `spec_ids`.\n\nDanh sách tiền tố cũng nằm trong `wiki.json → prefixes`; khi thêm tiền tố thì sửa cả hai chỗ.\n\n| Tiền tố | Phân hệ | Hub |\n|---|---|---|\n| `AUTH` | Xác thực và tài khoản | [Xác thực và tài khoản](pages/overview/module-authentication.md) |\n| `ORG` | Tổ chức và nhân sự | [Tổ chức và nhân sự](pages/overview/module-organization.md) |\n| `MTG` | Điểm danh cuộc họp | [Điểm danh cuộc họp](pages/overview/module-meeting.md) |\n| `ATT` | Chấm công vào ra | [Chấm công vào ra](pages/overview/module-attendance.md) |\n| `DASH` | Bảng điều khiển báo cáo | [Bảng điều khiển báo cáo](pages/overview/module-dashboard.md) |\n\n**Quyết định của chủ sở hữu:**\n- Ghi vào trang source riêng `sources/<module>-decisions-YYYY-MM-DD.md`, rồi cập nhật các mã liên quan.\n- Trang mới hơn thắng.\n- Câu được chốt theo phương án AI đề xuất thì đánh dấu \"chốt theo đề xuất\", để chủ sở hữu duyệt lại sau.\n\n**Thứ tự ưu tiên khi nguồn mâu thuẫn:**\n\n1. Quyết định của chủ sở hữu (trang `*-decisions-*` mới nhất).\n2. tài liệu yêu cầu trong raw/specs/ (bản mới hơn thắng)\n3. Tài liệu phái sinh, ví dụ PRD do AI viết.\n\nCode (khi đã có) chỉ là bằng chứng triển khai, không phải spec. Code khác spec thì ghi vào `Khác biệt spec ↔ code`.\n\nMâu thuẫn phải được ghi ở cả hai trang liên quan và trong kết quả lint.\n\n## 6. Quy trình\n\n### 6.1 Ingest (nạp nguồn mới)\n\n1. Người dùng thả nguồn vào `raw/`, hoặc chỉ định file trong repo. Với spreadsheet: lưu bản gốc, cùng export từng tab ra `.csv` và `.md` nguyên văn, không sửa nội dung.\n\n2. LLM đọc toàn bộ nguồn, tách thành các quy tắc kiểm được và đặt mã spec. Chỗ nào chưa rõ thì ghi `[CẦN LÀM RÕ]`, không tự quyết.\n\n3. Tạo hoặc cập nhật **một trang source cho mỗi nguồn** trong `pages/sources/` (không gộp nhiều tài liệu vào một trang), định nghĩa mã spec mới nếu có.\n4. Cập nhật mọi trang entity, concept, flow, screen bị ảnh hưởng. Khi thông tin mới mâu thuẫn với trang cũ: không xoá, mà ghi rõ mâu thuẫn và nguồn nào thắng theo §5.\n5. Cập nhật bảng `Khác biệt spec ↔ code` của các trang liên quan.\n6. Cập nhật `index.md`: thêm trang mới, sửa mô tả một dòng. Cập nhật `updated:` của mọi trang đã sửa.\n7. Ghi thêm entry vào `log.md` theo dạng `## [YYYY-MM-DD] ingest | <Tên nguồn>`, kèm danh sách trang đã tạo hoặc sửa.\n8. Chạy lint (§6.3) và sửa cho sạch trước khi báo xong. Khi `wiki.json` có khối `coverage`, \"sạch\" gồm cả độ phủ: **0 lỗi cấu trúc ≠ đã phủ**.\n\n### 6.2 Query (hỏi đáp)\n\n1. Đọc `index.md` trước, chọn trang liên quan rồi đọc sâu. Chỉ quay về `raw/`, tài liệu repo hoặc code khi wiki thiếu.\n2. Trả lời kèm link trang wiki và mã spec.\n3. Câu trả lời có giá trị lâu dài (so sánh, phân tích, bảng tra) thì lưu thành trang mới, thường là `concept` hoặc `overview`, và cập nhật `index.md`.\n4. Ghi `## [YYYY-MM-DD] query | <Câu hỏi ngắn>` vào `log.md`.\n\n### 6.3 Lint (kiểm tra sức khoẻ)\n\n```bash\npython3 -I tools/lint_wiki.py .          # chạy từ trong llm-wiki/; thoát 1 nếu có lỗi\npython3 -I tools/lint_wiki.py . --json   # số liệu máy đọc: khoảng trống, câu hỏi mở, độ phủ mã\npython3 -I tools/obsidian_graph.py .     # graph như Obsidian thấy\n```\n\nScript kiểm frontmatter, link hỏng, anchor, trang mồ côi, trang thiếu trong index, mục bắt buộc, wikilink, độ dài trang, định dạng log, mã spec lạ, bằng chứng `repo:` trỏ tới file không tồn tại, và chuỗi giống secret.\n\n**Độ phủ code ↔ wiki** (khi `wiki.json` có khối `coverage`; lint tự gọi `tools/coverage_wiki.py`):\n\n```bash\npython3 -I tools/coverage_wiki.py . --unclaimed --owner <PREFIX>   # fact chưa mô tả — đầu vào brief ingest\npython3 -I tools/coverage_wiki.py . --accept                       # người duyệt: khoá dấu vân tay claim đã kiểm\npython3 -I tools/coverage_wiki.py . --baseline                     # lần đầu: chụp nợ cũ; về sau: chỉ co lại\n```\n\n- **Fact** = một symbol có tên tạo/đổi/xoá một subject (bảng…), id `verb:kind:name@path#symbol`, kèm dấu vân tay\n  (cột + literal được ghi). Kho fact tính lại mỗi lần từ code, không commit.\n- **Lỗi:** fact bắt buộc chưa claim · claim trỏ fact không còn · bằng chứng ngoài thân symbol / là dòng import / dải\n  quá dài · mã spec không thuộc chủ · claim đặt ở trang không thuộc chủ · dấu vân tay đổi so với lần `--accept`\n  · lần nhắc bảng chưa phân loại · subject chưa khai báo chủ · dòng gap `OK`/`PARTIAL`/`CONTRADICTS` không trỏ fact\n  sống nào · baseline có id mới so với merge-base/HEAD hoặc quá hạn · exclusion thiếu chữ ký người.\n- **File quyết định** `wiki.json`, `coverage/{exclusions,baseline,renames,claims.lock}.json` do người duyệt đổi\n  (hook chặn agent); mọi thay đổi so với git HEAD được in trong báo cáo.\n- **Chưa phủ theo thiết kế** (chỉ đếm, không phải lỗi): SQL chỉ đọc, cron/queue, cache/Redis, HTTP ra ngoài.\n\nLLM kiểm thêm phần script không làm được:\n- mâu thuẫn giữa các nguồn và giữa các trang;\n- số dòng trong bằng chứng đã trôi;\n- tài liệu ghi \"Done\" mà code chưa có;\n- khái niệm được nhắc nhiều mà chưa có trang.\n\nGhi kết quả vào `log.md` theo dạng `## [YYYY-MM-DD] lint | <Phạm vi>`, gồm các mục Orphans / Mâu thuẫn / Khoảng trống / Việc cần làm.\n\n### 6.4 Decide (ghi quyết định)\n\n1. Chủ sở hữu trả lời câu hỏi mở.\n2. LLM ghi câu trả lời vào `sources/<module>-decisions-YYYY-MM-DD.md`: câu hỏi, phương án được chọn, các phương án bị loại, người quyết định, các trang và feature bị ảnh hưởng.\n3. Cập nhật các trang liên quan; bỏ `[CẦN LÀM RÕ]` ở chỗ đã chốt.\n4. Ghi `## [YYYY-MM-DD] decide | <Phạm vi>` vào `log.md`.\n\n## 7. Quy tắc `index.md` và `log.md`\n\n- `index.md` nhóm trang theo loại (Overview, Sources, Entities, Concepts, Flows, Screens).\n  - Mỗi dòng có dạng `- [Tiêu đề](pages/...md) — mô tả một dòng`.\n  - Trang screen thêm ` · status` ở cuối dòng.\n- `log.md` là **append-only**, mới nhất ở cuối.\n  - Mỗi entry bắt đầu đúng dạng `## [YYYY-MM-DD] ingest|query|lint|decide | Tiêu đề`, để `grep` được.\n  - Không sửa entry cũ. Ghi sai thì ghi entry mới để đính chính.\n\n## 8. Ràng buộc với phần còn lại của repo\n\n- Khi làm việc với wiki, không sửa code app, thư mục harness, skill, tệp chỉ dẫn agent gốc (`AGENTS.md`, `GEMINI.md`, `CLAUDE.md`…), trừ khi người dùng yêu cầu riêng.\n- Wiki mô tả yêu cầu. Sửa code cho khớp spec là nhiệm vụ riêng: lấy bảng `Khác biệt spec ↔ code` làm nguồn backlog cho harness (AGY-Harness Kit: `agy-harness-ingest`).\n- Không ghi secret (mật khẩu, token, khoá) vào wiki. Chỉ ghi `file:line` và loại secret.\n"}, {"path": "index.md", "title": "Danh mục — LLM Wiki Attendance Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# Danh mục — LLM Wiki Attendance Portal\n\n> Mỗi dòng: `- [Tiêu đề](pages/...md) — mô tả một dòng`. Cập nhật mỗi lần ingest (SCHEMA §7).\n\n## Điều hướng\n\n- [SCHEMA](SCHEMA.md) — quy ước của wiki\n- [Mở bằng Obsidian](OBSIDIAN.md) — xem graph\n- [Nhật ký](log.md) — ingest/query/lint/decide\n\n## Overview\n\n- [Tổng quan Attendance Portal](pages/overview/project-overview.md) — bức tranh tổng quan hệ thống\n- [Xác thực và tài khoản](pages/overview/module-authentication.md) — phân hệ xác thực và tài khoản đơn vị\n- [Tổ chức và nhân sự](pages/overview/module-organization.md) — phân hệ cơ cấu phòng ban và hồ sơ nhân sự\n- [Điểm danh cuộc họp](pages/overview/module-meeting.md) — phân hệ điểm danh cuộc họp\n- [Chấm công vào ra](pages/overview/module-attendance.md) — phân hệ chấm công vào ra cơ quan\n- [Bảng điều khiển báo cáo](pages/overview/module-dashboard.md) — phân hệ bảng điều khiển báo cáo\n\n## Sources\n\n- [Yêu cầu khởi tạo Attendance Portal](pages/sources/initial-requirements.md) — yêu cầu khởi tạo từ Product Owner\n- [Quyết định Kiến trúc & Danh mục Tính năng 2026-11-02](pages/sources/portal-architecture-decisions-2026-11-02.md) — quyết định chốt kiến trúc và danh mục tính năng\n\n## Entities\n\n- [Tài khoản đơn vị](pages/entities/tenant-account.md) — tài khoản đơn vị do Finviet cấp phát\n- [Phòng ban](pages/entities/department.md) — cây cơ cấu tổ chức và phòng ban\n- [Nhân viên](pages/entities/employee.md) — hồ sơ nhân sự, mã nhân viên và ảnh Face ID\n- [Thẻ nhân viên](pages/entities/employee-card.md) — thẻ nhân viên vật lý RFID/NFC\n- [Cuộc họp](pages/entities/meeting.md) — cuộc họp, phòng họp và danh sách đại biểu\n- [Bản ghi điểm danh](pages/entities/attendance-record.md) — sự kiện quét Face ID và quẹt thẻ vật lý\n- [Ca làm việc](pages/entities/work-shift.md) — khung ca hành chính chuẩn và dung sai đi muộn\n- [Báo cáo chuyên cần](pages/entities/attendance-summary.md) — báo cáo chuyên cần tổng hợp sau họp và toàn cơ quan\n\n## Flows\n\n- [Luồng đăng nhập và quản lý phiên](pages/flows/authentication-flow.md) — quy trình đăng nhập tài khoản đơn vị\n- [Luồng quản lý nhân sự](pages/flows/employee-management-flow.md) — quy trình quản lý phòng ban, nhân viên và thẻ\n- [Luồng điểm danh cuộc họp](pages/flows/meeting-attendance-flow.md) — quy trình lên lịch họp, Live roll-call và xuất biên bản\n- [Luồng chấm công vào ra cơ quan](pages/flows/daily-attendance-flow.md) — quy trình chấm công vào ra hàng ngày\n- [Luồng xem báo cáo tổng hợp](pages/flows/dashboard-reporting-flow.md) — quy trình xem báo cáo sau họp và chuyên cần\n\n## Screens\n\n- [Màn hình đăng nhập](pages/screens/login-screen.md) — giao diện đăng nhập và đổi mật khẩu lần đầu\n- [Màn hình quản lý nhân viên](pages/screens/employee-management-screen.md) — giao diện quản lý phòng ban, nhân viên và thẻ\n- [Màn hình điểm danh cuộc họp](pages/screens/meeting-attendance-screen.md) — giao diện tạo họp và Live roll-call phòng họp\n- [Màn hình chấm công ngày](pages/screens/daily-attendance-screen.md) — giao diện chấm công ngày và cấu hình ca chuẩn\n- [Bảng điều khiển báo cáo](pages/screens/attendance-dashboard.md) — giao diện báo cáo tổng hợp sau họp và chuyên cần\n"}, {"path": "log.md", "title": "Log — LLM Wiki Attendance Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# Log — LLM Wiki Attendance Portal\n\n> Append-only, mới nhất ở cuối. Định dạng: `## [YYYY-MM-DD] ingest|query|lint|decide | Tiêu đề` (SCHEMA §7).\n> `grep \"^## \\[\" log.md | tail -5`\n\n## [2026-11-02] lint | Khởi tạo wiki (skill llm-wiki, chế độ new)\n\n- Tạo SCHEMA.md, wiki.json, index.md, log.md, OBSIDIAN.md, tools/ (lint, graph, viewer), .obsidian/, khung raw/ và pages/.\n- Tiền tố: chưa có. Code: —. Tài liệu: —.\n\n## [2026-11-02] ingest | raw/specs/initial-requirements.md\n\n- Nạp yêu cầu khởi tạo hệ thống Attendance Portal từ Product Owner.\n- Định nghĩa 10 mã spec thuộc 4 phân hệ: MTG (Điểm danh cuộc họp), CC (Chấm công vào ra), TB (Thiết bị và tích hợp), NV (Tổ chức và nhân sự).\n- Tạo các trang entities (meeting, attendance-record, employee, device), flows (meeting-attendance-flow, daily-attendance-flow), screens (meeting-attendance-screen, attendance-dashboard) và 4 module overview.\n\n## [2026-11-02] decide | Quyết định tinh giản kiến trúc & chốt danh mục 14 tính năng\n\n- Chốt kiến trúc 4 phân hệ nghiệp vụ chính (Bảng điều khiển báo cáo, Điểm danh cuộc họp, Chấm công vào ra, Tổ chức và nhân sự) và phân hệ nền tảng Xác thực & tài khoản.\n- Định nghĩa 14 mã spec qua 5 tiền tố chuẩn: AUTH, ORG, MTG, ATT, DASH.\n- Ghim quy chuẩn giao diện bắt buộc: Toàn bộ frontend tuân thủ token và CSS variables từ Design System/src/css.css.\n- Bỏ phân hệ Nhật ký rời và phân hệ Thiết bị riêng; tích hợp báo cáo trực tiếp vào từng phân hệ.\n"}, {"path": "pages/entities/attendance-record.md", "title": "Bản ghi điểm danh", "type": "entity", "group": "entities", "fm": {"title": "Bản ghi điểm danh", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["MTG-02", "MTG-03", "ATT-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Bản ghi điểm danh\n\n## Định nghĩa\nThực thể `Bản ghi điểm danh` (Attendance Record) lưu trữ bất biến từng sự kiện nhận diện khuôn mặt Face ID hoặc quẹt thẻ vật lý của nhân sự, phục vụ điểm danh cuộc họp hoặc chấm công vào ra cơ quan.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| MTG-02 | Bản ghi điểm danh cuộc họp lưu kèm mã cuộc họp, thời điểm quét, phương thức (Face ID / Thẻ), ảnh chụp đối soát và trạng thái đúng giờ/muộn so với giờ họp. | Hiển thị tức thì trên màn hình Live roll-call |\n| MTG-03 | Bản ghi rời cuộc họp lưu thời điểm check-out, làm cơ sở tính thời lượng tham dự thực tế. | Chống trùng lặp nếu quét liên tiếp trong 60 giây |\n| ATT-02 | Bản ghi chấm công cơ quan lưu thời điểm quét tại cổng, phương thức và tự động phân loại là Check-in đầu ngày hoặc Check-out tan ca. | Đối chiếu với khung ca làm việc chuẩn |\n\n## Quan hệ\n- Thuộc về một [Nhân viên](employee.md).\n- Có thể gắn với một [Cuộc họp](meeting.md) nếu sự kiện diễn ra tại phòng họp.\n- Được đối soát với [Ca làm việc](work-shift.md) trong chấm công hàng ngày.\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| MTG-02 | P0 | Xử lý sự kiện điểm danh vào cuộc họp qua Face ID / Thẻ | Chưa triển khai | MISSING | - |\n| MTG-03 | P0 | Xử lý sự kiện điểm danh ra khỏi cuộc họp | Chưa triển khai | MISSING | - |\n| ATT-02 | P1 | Tiếp nhận sự kiện Check-in/Check-out hàng ngày từ cổng cơ quan | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Điểm danh cuộc họp](../overview/module-meeting.md)\n- [Phân hệ Chấm công vào ra](../overview/module-attendance.md)\n- [Cuộc họp](meeting.md)\n"}, {"path": "pages/entities/attendance-summary.md", "title": "Báo cáo chuyên cần", "type": "entity", "group": "entities", "fm": {"title": "Báo cáo chuyên cần", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["DASH-01", "DASH-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Báo cáo chuyên cần\n\n## Định nghĩa\nThực thể `Báo cáo chuyên cần` (Attendance Summary) là tập hợp các chỉ số thống kê tổng hợp phục vụ lãnh đạo cơ quan, chỉ tính toán sau khi các cuộc họp đã kết thúc và tổng kết dữ liệu hiện diện theo ngày, tuần hoặc tháng.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| DASH-01 | Tổng hợp danh mục các cuộc họp đã kết thúc trong kỳ: Tên cuộc họp, thời gian thực tế, tỷ lệ đại biểu có mặt (% chuyên cần), số đại biểu vắng, liên kết tải nhanh biên bản họp. | Không hiển thị cuộc họp đang diễn ra |\n| DASH-02 | Thống kê xu hướng hiện diện toàn cơ quan: Tổng số nhân sự, tỷ lệ đúng giờ, tỷ lệ đi muộn, tỷ lệ vắng mặt; biểu đồ chuyên cần so sánh giữa các phòng ban. | Cập nhật theo chu kỳ ngày, tuần, tháng |\n\n## Quan hệ\n- Thuộc về [Tài khoản đơn vị](tenant-account.md).\n- Tổng hợp dữ liệu từ các [Cuộc họp](meeting.md) đã hoàn tất và các [Bản ghi điểm danh](attendance-record.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| DASH-01 | P2 | Thống kê tổng hợp các cuộc họp đã kết thúc và tỷ lệ chuyên cần | Chưa triển khai | MISSING | - |\n| DASH-02 | P2 | Biểu đồ xu hướng hiện diện cơ quan theo ngày/tuần/tháng | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Bảng điều khiển báo cáo](../overview/module-dashboard.md)\n- [Bảng điều khiển báo cáo](../screens/attendance-dashboard.md)\n- [Cuộc họp](meeting.md)\n"}, {"path": "pages/entities/department.md", "title": "Phòng ban", "type": "entity", "group": "entities", "fm": {"title": "Phòng ban", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ORG-01"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Phòng ban\n\n## Định nghĩa\nThực thể `Phòng ban` (Department / Division) đại diện cho một đơn vị cấu thành cơ cấu tổ chức của cơ quan khách hàng (Khối/Phòng/Ban đối với UBND; Phòng/Phân xưởng/Tổ sản xuất đối với Nhà máy; Khoa/Phòng khám/Tổ điều dưỡng đối với Bệnh viện).\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| ORG-01 | Mỗi phòng ban có mã định danh, tên phòng ban, cấp quản lý trực thuộc và người phụ trách phòng ban. Cho phép thiết lập cây phân cấp cha - con linh hoạt. | Dùng làm tiêu chí lọc báo cáo và triệu tập đại biểu họp |\n\n## Quan hệ\n- Thuộc về một [Tài khoản đơn vị](tenant-account.md).\n- Chứa danh sách các [Nhân viên](employee.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ORG-01 | P0 | Quản lý cây cơ cấu phòng ban / đơn vị đa mô hình | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Tổ chức và nhân sự](../overview/module-organization.md)\n- [Nhân viên](employee.md)\n- [Màn hình quản lý nhân viên](../screens/employee-management-screen.md)\n"}, {"path": "pages/entities/employee-card.md", "title": "Thẻ nhân viên", "type": "entity", "group": "entities", "fm": {"title": "Thẻ nhân viên", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ORG-03"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thẻ nhân viên\n\n## Định nghĩa\nThực thể `Thẻ nhân viên` (Employee Card) đại diện cho thẻ vật lý (thẻ nhựa RFID/NFC/Mifare) được đơn vị cấp phát cho nhân viên để thực hiện quẹt thẻ điểm danh tại phòng họp hoặc chấm công vào ra tại cổng cơ quan.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| ORG-03 | Quản lý mã UID vật lý của thẻ, ngày liên kết, trạng thái thẻ (Đang hoạt động, Tạm khóa, Đã hủy). Mỗi thẻ tại một thời điểm chỉ liên kết với duy nhất một nhân viên. Khi nhân viên mất thẻ, hệ thống cho phép hủy thẻ cũ và liên kết mã thẻ mới ngay lập tức. | Kế thừa logic liên kết thẻ từ ECO Card |\n\n## Quan hệ\n- Liên kết với một [Nhân viên](employee.md).\n- Khi chạm vào đầu đọc, tạo ra [Bản ghi điểm danh](attendance-record.md) mang mã thẻ này.\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ORG-03 | P0 | Quản lý cấp phát, liên kết và thu hồi thẻ vật lý nhân viên | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Tổ chức và nhân sự](../overview/module-organization.md)\n- [Nhân viên](employee.md)\n- [Màn hình quản lý nhân viên](../screens/employee-management-screen.md)\n"}, {"path": "pages/entities/employee.md", "title": "Nhân viên", "type": "entity", "group": "entities", "fm": {"title": "Nhân viên", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ORG-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Nhân viên\n\n## Định nghĩa\nThực thể `Nhân viên` (Employee) đại diện cho một cán bộ, công chức, công nhân viên, bác sĩ hoặc nhân sự thuộc biên chế của cơ quan khách hàng. Nhân viên lưu giữ thông tin cá nhân, chức vụ, liên kết phòng ban và dữ liệu nhận diện khuôn mặt (Face ID).\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| ORG-02 | Mỗi nhân viên có mã nhân viên duy nhất (Employee ID), họ tên, số CCCD/hộ chiếu, chức danh/vị trí công tác, phòng ban trực thuộc, email, số điện thoại và ảnh chân dung nhận diện khuôn mặt (Face ID). Hỗ trợ import danh sách từ Excel và tải ảnh chân dung hàng loạt. | Tự động đồng bộ sang hệ sinh thái nhận diện Face ID |\n\n## Quan hệ\n- Thuộc về một [Phòng ban](department.md).\n- Được cấp phát một hoặc nhiều [Thẻ nhân viên](employee-card.md).\n- Có thể được triệu tập tham dự các [Cuộc họp](meeting.md).\n- Sinh ra các [Bản ghi điểm danh](attendance-record.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ORG-02 | P0 | Quản lý hồ sơ nhân sự, import Excel và nạp ảnh Face ID | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Tổ chức và nhân sự](../overview/module-organization.md)\n- [Thẻ nhân viên](employee-card.md)\n- [Màn hình quản lý nhân viên](../screens/employee-management-screen.md)\n"}, {"path": "pages/entities/meeting.md", "title": "Cuộc họp", "type": "entity", "group": "entities", "fm": {"title": "Cuộc họp", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["MTG-01", "MTG-02", "MTG-03", "MTG-04"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Cuộc họp\n\n## Định nghĩa\nThực thể `Cuộc họp` (Meeting) đại diện cho một sự kiện hội nghị, họp giao ban hoặc tọa đàm do cơ quan tổ chức tại một phòng họp chỉ định.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| MTG-01 | Cuộc họp bắt buộc có tiêu đề, tên phòng họp, thời điểm bắt đầu - kết thúc dự kiến và danh sách đại biểu được triệu tập (đại biểu bắt buộc, đại biểu tùy chọn). | Hỗ trợ chọn nhanh đại biểu theo phòng ban |\n| MTG-02 | Khi đại biểu thực hiện Check-in tại phòng họp qua Face ID hoặc quẹt thẻ, hệ thống đối soát tức thì với danh sách triệu tập, ghi nhận thời điểm và hiển thị ảnh đối soát. | Cập nhật ngay trên màn hình Live roll-call |\n| MTG-03 | Khi đại biểu thực hiện Check-out hoặc khi người chủ trì bấm kết thúc cuộc họp, hệ thống chốt danh sách và tính thời lượng tham dự thực tế. | Đánh dấu các trường hợp về sớm trước khi tan họp |\n| MTG-04 | Biên bản và báo cáo chuyên cần tự động tổng hợp tỷ lệ tham dự (% có mặt, số người đi muộn, số người vắng mặt); hỗ trợ xuất file PDF và Excel có chữ ký số hoặc dấu mộc lưu hồ sơ. | Báo cáo chốt dữ liệu bất biến sau khi kết thúc họp |\n\n## Quan hệ\n- Thuộc về [Tài khoản đơn vị](tenant-account.md).\n- Triệu tập danh sách các [Nhân viên](employee.md).\n- Sinh ra danh sách các [Bản ghi điểm danh](attendance-record.md).\n- Cung cấp dữ liệu đã kết thúc cho [Báo cáo chuyên cần](attendance-summary.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| MTG-01 | P0 | Thiết lập lịch họp, phòng họp, triệu tập danh sách đại biểu | Chưa triển khai | MISSING | - |\n| MTG-02 | P0 | Điểm danh trực tiếp tại phòng họp qua Face ID / Thẻ vật lý | Chưa triển khai | MISSING | - |\n| MTG-03 | P0 | Ghi nhận Check-out rời phòng họp và tính toán thời gian tham dự | Chưa triển khai | MISSING | - |\n| MTG-04 | P0 | Báo cáo chuyên cần và xuất biên bản cuộc họp PDF/Excel | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Điểm danh cuộc họp](../overview/module-meeting.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n- [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md)\n"}, {"path": "pages/entities/tenant-account.md", "title": "Tài khoản đơn vị", "type": "entity", "group": "entities", "fm": {"title": "Tài khoản đơn vị", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["AUTH-01", "AUTH-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Tài khoản đơn vị\n\n## Định nghĩa\nThực thể `Tài khoản đơn vị` (Tenant Account) đại diện cho tài khoản quản trị của cơ quan khách hàng (UBND phường, Doanh nghiệp/Nhà máy, Bệnh viện) được Finviet cấp phát trực tiếp. Tài khoản xác thực danh tính đơn vị và thực thi phân quyền cô lập dữ liệu.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| AUTH-01 | Tài khoản đơn vị gồm tên đăng nhập (username/mã đơn vị), mật khẩu mã hóa, tên cơ quan và loại hình đơn vị. Đăng nhập thành công cấp mã token phiên làm việc, giới hạn dữ liệu xem và chỉnh sửa duy nhất trong phạm vi đơn vị đó. | Bảo đảm nguyên tắc đa khách hàng (multi-tenancy) |\n| AUTH-02 | Khi đăng nhập lần đầu với mật khẩu mặc định của Finviet, hệ thống yêu cầu đổi mật khẩu mới. Hỗ trợ cập nhật thông tin người đại diện và hotline hỗ trợ của đơn vị. | Tự động hết hạn phiên sau thời gian không hoạt động |\n\n## Quan hệ\n- Sở hữu toàn bộ cây [Phòng ban](department.md) và danh sách [Nhân viên](employee.md).\n- Quản lý các [Cuộc họp](meeting.md) và cấu hình [Ca làm việc](work-shift.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| AUTH-01 | P0 | Đăng nhập tài khoản đơn vị với username/password do Finviet cấp, cô lập dữ liệu | Chưa triển khai | MISSING | - |\n| AUTH-02 | P0 | Quản lý phiên làm việc, đổi mật khẩu và hồ sơ đơn vị | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Xác thực và tài khoản](../overview/module-authentication.md)\n- [Luồng đăng nhập và quản lý phiên](../flows/authentication-flow.md)\n- [Màn hình đăng nhập](../screens/login-screen.md)\n"}, {"path": "pages/entities/work-shift.md", "title": "Ca làm việc", "type": "entity", "group": "entities", "fm": {"title": "Ca làm việc", "type": "entity", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ATT-01"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Ca làm việc\n\n## Định nghĩa\nThực thể `Ca làm việc` (Work Shift) đại diện cho khung thời gian làm việc chuẩn của cơ quan. Hệ thống cung cấp sẵn Ca hành chính mặc định tinh gọn và cho phép đơn vị tùy chỉnh thời gian vào/tan ca cùng số phút dung sai đi muộn cho phép.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| ATT-01 | Khung ca làm việc gồm: Giờ bắt đầu ca sáng (mặc định 07:30), giờ kết thúc ca sáng (11:30), giờ bắt đầu ca chiều (13:30), giờ tan ca chiều (17:00), và dung sai cho phép đi muộn (mặc định 10 phút). Nhân viên quét Check-in sau giờ bắt đầu + dung sai sẽ bị ghi nhận là Đi muộn kèm số phút muộn. | Áp dụng mặc định cho toàn cơ quan |\n\n## Quan hệ\n- Thuộc về [Tài khoản đơn vị](tenant-account.md).\n- Dùng làm thước đo quy chiếu cho các [Bản ghi điểm danh](attendance-record.md) chấm công hàng ngày.\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ATT-01 | P1 | Thiết lập khung giờ ca hành chính chuẩn và dung sai đi muộn | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Chấm công vào ra](../overview/module-attendance.md)\n- [Bản ghi điểm danh](attendance-record.md)\n- [Màn hình chấm công ngày](../screens/daily-attendance-screen.md)\n"}, {"path": "pages/flows/authentication-flow.md", "title": "Luồng đăng nhập và quản lý phiên", "type": "flow", "group": "flows", "fm": {"title": "Luồng đăng nhập và quản lý phiên", "type": "flow", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["AUTH-01", "AUTH-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng đăng nhập và quản lý phiên\n\n## Mục tiêu\nCung cấp cổng xác thực an toàn cho người quản trị cơ quan khách hàng truy cập vào hệ thống Attendance Portal với tài khoản do Finviet cấp phát, bảo đảm dữ liệu được cô lập hoàn toàn giữa các khách hàng (multi-tenancy).\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản trị đơn vị | [Màn hình đăng nhập](../screens/login-screen.md) | Nhập tên đăng nhập (Username/Mã đơn vị) và mật khẩu do Finviet cấp | Gửi yêu cầu xác thực tới máy chủ | AUTH-01 |\n| 2 | Hệ thống | Cổng xác thực | Kiểm tra thông tin đăng nhập, xác định đơn vị khách hàng | Cấp mã token phiên làm việc, thiết lập quyền hạn | AUTH-01 |\n| 3 | Quản trị đơn vị | [Màn hình đăng nhập](../screens/login-screen.md) | Nếu đăng nhập lần đầu với mật khẩu mặc định, hiển thị form đổi mật khẩu | Cập nhật mật khẩu mới và chuyển tiếp vào hệ thống | AUTH-02 |\n| 4 | Hệ thống | Toàn hệ thống | Điều hướng người dùng vào trang Bảng điều khiển hoặc Lịch cuộc họp | Chỉ hiển thị dữ liệu thuộc đơn vị quản trị | AUTH-01 |\n\n## Quy tắc chặn / validation\n- Khóa tài khoản tạm thời 15 phút nếu nhập sai mật khẩu quá 5 lần liên tiếp.\n- Mật khẩu mới bắt buộc tối thiểu 8 ký tự, bao gồm chữ hoa, chữ thường và số.\n- Không cho phép người dùng từ đơn vị này xem hoặc sửa đổi bất kỳ tài nguyên nào thuộc đơn vị khác.\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| AUTH-01 | P0 | Xác thực tài khoản đơn vị do Finviet cấp và cô lập dữ liệu | Chưa triển khai | MISSING | - |\n| AUTH-02 | P0 | Quản lý phiên làm việc, bắt buộc đổi mật khẩu lần đầu | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Tài khoản đơn vị](../entities/tenant-account.md)\n- [Màn hình đăng nhập](../screens/login-screen.md)\n- [Phân hệ Xác thực và tài khoản](../overview/module-authentication.md)\n"}, {"path": "pages/flows/daily-attendance-flow.md", "title": "Luồng chấm công vào ra cơ quan", "type": "flow", "group": "flows", "fm": {"title": "Luồng chấm công vào ra cơ quan", "type": "flow", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ATT-01", "ATT-02", "ATT-03"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Luồng chấm công vào ra cơ quan\n\n## Mục tiêu\nQuản lý chu trình vào cơ quan đầu ngày và tan ca ra về cuối ngày của nhân sự; áp dụng khung giờ hành chính chuẩn tinh gọn để tự động xác định trạng thái đúng giờ, đi muộn, về sớm hoặc vắng mặt.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản trị đơn vị | [Màn hình chấm công ngày](../screens/daily-attendance-screen.md) | Cấu hình hoặc giữ nguyên Khung ca hành chính chuẩn (Sáng 07:30 - 11:30, Chiều 13:30 - 17:00, dung sai 10 phút) | Thiết lập mốc giờ chuẩn làm căn cứ chấm công | ATT-01 |\n| 2 | Nhân viên | Cổng cơ quan | Quẹt thẻ hoặc nhận diện khuôn mặt Face ID khi đến cơ quan | Thiết bị ghi nhận và gửi sự kiện về hệ thống | ATT-02 |\n| 3 | Hệ thống | Cổng dịch vụ nền | Tiếp nhận sự kiện Check-in đầu tiên trong ngày, đối chiếu với giờ bắt đầu ca | Tự động phân loại: Đúng giờ (nếu trước 07:40) hoặc Đi muộn (kèm số phút) | ATT-02, ATT-03 |\n| 4 | Nhân viên | Cổng cơ quan | Quẹt thẻ hoặc nhận diện khuôn mặt khi tan làm ra về | Ghi nhận thời điểm Check-out cuối ngày | ATT-02 |\n| 5 | Quản trị nhân sự | [Màn hình chấm công ngày](../screens/daily-attendance-screen.md) | Mở bảng theo dõi chấm công ngày | Xem danh sách cán bộ nhân viên đã đến, ai chưa đến, ai đi muộn | ATT-03 |\n\n## Quy tắc chặn / validation\n- Nhân viên vào/ra nhiều lần trong ngày: Mốc quét sớm nhất được tính là Check-in đầu ngày; mốc quét muộn nhất được tính là Check-out tan ca.\n- Nhân viên không có bất kỳ lượt quét nào trong ngày làm việc sẽ được hệ thống gắn nhãn \"Chưa đến / Vắng mặt\".\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ATT-01 | P1 | Cấu hình khung giờ ca hành chính chuẩn và dung sai đi muộn | Chưa triển khai | MISSING | - |\n| ATT-02 | P1 | Tiếp nhận sự kiện Check-in/Check-out hàng ngày từ cổng cơ quan | Chưa triển khai | MISSING | - |\n| ATT-03 | P1 | Bảng theo dõi Chấm công Ngày và phân loại Đúng giờ / Muộn / Vắng | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Ca làm việc](../entities/work-shift.md)\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Màn hình chấm công ngày](../screens/daily-attendance-screen.md)\n"}, {"path": "pages/flows/dashboard-reporting-flow.md", "title": "Luồng xem báo cáo tổng hợp", "type": "flow", "group": "flows", "fm": {"title": "Luồng xem báo cáo tổng hợp", "type": "flow", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["DASH-01", "DASH-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng xem báo cáo tổng hợp\n\n## Mục tiêu\nCung cấp bức tranh toàn cảnh về tình hình hội họp và mức độ chuyên cần của toàn cơ quan cho lãnh đạo đơn vị, chỉ tổng hợp khi cuộc họp đã hoàn tất.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Lãnh đạo / Quản trị | [Bảng điều khiển báo cáo](../screens/attendance-dashboard.md) | Truy cập Bảng điều khiển (Dashboard) | Hiển thị các chỉ số chuyên cần tổng hợp của toàn cơ quan | DASH-01, DASH-02 |\n| 2 | Lãnh đạo / Quản trị | [Bảng điều khiển báo cáo](../screens/attendance-dashboard.md) | Xem danh mục các cuộc họp đã kết thúc trong kỳ | Thống kê số lượng cuộc họp, tỷ lệ tham gia trung bình, xem chi tiết và tải nhanh biên bản | DASH-01 |\n| 3 | Lãnh đạo / Quản trị | [Bảng điều khiển báo cáo](../screens/attendance-dashboard.md) | Chọn khoảng thời gian (Hôm nay, Tuần này, Tháng này) hoặc lọc theo phòng ban | Biểu đồ xu hướng cập nhật: tỷ lệ đi làm đúng giờ, đi muộn, vắng mặt | DASH-02 |\n\n## Quy tắc chặn / validation\n- Bảng điều khiển tuyệt đối không hiển thị các cuộc họp đang diễn ra hay tỷ lệ thiếu người dang dở; chỉ tổng hợp các cuộc họp đã kết thúc.\n- Toàn bộ giao diện thẻ thống kê, biểu đồ và widget phải áp dụng đúng biến CSS và token màu từ `Design System/src/css.css`.\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| DASH-01 | P2 | Tổng hợp danh mục các cuộc họp đã kết thúc và tỷ lệ chuyên cần | Chưa triển khai | MISSING | - |\n| DASH-02 | P2 | Biểu đồ xu hướng hiện diện cơ quan theo ngày/tuần/tháng | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Báo cáo chuyên cần](../entities/attendance-summary.md)\n- [Bảng điều khiển báo cáo](../screens/attendance-dashboard.md)\n- [Phân hệ Bảng điều khiển báo cáo](../overview/module-dashboard.md)\n"}, {"path": "pages/flows/employee-management-flow.md", "title": "Luồng quản lý nhân sự", "type": "flow", "group": "flows", "fm": {"title": "Luồng quản lý nhân sự", "type": "flow", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ORG-01", "ORG-02", "ORG-03"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Luồng quản lý nhân sự\n\n## Mục tiêu\nThiết lập toàn bộ dữ liệu nền tảng gồm cơ cấu phòng ban, danh sách nhân viên kèm ảnh chân dung nhận diện Face ID và mã thẻ vật lý, làm căn cứ triệu tập đại biểu hội họp và chấm công hàng ngày.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản trị nhân sự | [Màn hình quản lý nhân viên](../screens/employee-management-screen.md) | Tạo mới hoặc import cơ cấu phòng ban từ file Excel | Cây phòng ban được cập nhật vào hệ thống | ORG-01 |\n| 2 | Quản trị nhân sự | [Màn hình quản lý nhân viên](../screens/employee-management-screen.md) | Thêm nhân viên hoặc tải file Excel danh sách nhân viên | Danh sách nhân viên được tạo, gắn vào phòng ban tương ứng | ORG-02 |\n| 3 | Quản trị nhân sự | [Màn hình quản lý nhân viên](../screens/employee-management-screen.md) | Nạp ảnh chân dung nhân viên (chụp trực tiếp hoặc tải file ảnh) | Dữ liệu Face ID sẵn sàng nạp xuống camera Hikvision | ORG-02 |\n| 4 | Quản trị nhân sự | [Màn hình quản lý nhân viên](../screens/employee-management-screen.md) | Nhập hoặc quẹt mã UID thẻ vật lý để gán vào nhân viên | Thẻ nhân viên được kích hoạt, liên kết với nhân sự | ORG-03 |\n\n## Quy tắc chặn / validation\n- Mã nhân viên và số CCCD không được trùng lặp trong phạm vi cùng một đơn vị.\n- Mã thẻ vật lý (Card UID) tại một thời điểm chỉ được phép liên kết với duy nhất một nhân viên.\n- Ảnh chân dung tải lên phải đạt chuẩn nhận diện khuôn mặt (định dạng JPG/PNG, dung lượng dưới 2MB, tỷ lệ khuôn mặt chiếm tối thiểu 50% khung hình).\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ORG-01 | P0 | Thiết lập và quản lý cơ cấu phòng ban | Chưa triển khai | MISSING | - |\n| ORG-02 | P0 | Quản lý danh sách nhân viên, import Excel và tải ảnh chân dung | Chưa triển khai | MISSING | - |\n| ORG-03 | P0 | Cấp phát và quản lý liên kết thẻ nhân viên vật lý | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Nhân viên](../entities/employee.md)\n- [Phòng ban](../entities/department.md)\n- [Thẻ nhân viên](../entities/employee-card.md)\n- [Màn hình quản lý nhân viên](../screens/employee-management-screen.md)\n"}, {"path": "pages/flows/meeting-attendance-flow.md", "title": "Luồng điểm danh cuộc họp", "type": "flow", "group": "flows", "fm": {"title": "Luồng điểm danh cuộc họp", "type": "flow", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["MTG-01", "MTG-02", "MTG-03", "MTG-04"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Luồng điểm danh cuộc họp\n\n## Mục tiêu\nTự động hóa hoàn toàn quy trình tổ chức và điểm danh cuộc họp: Lên lịch họp, triệu tập đại biểu, màn hình Live roll-call trực tiếp tại phòng họp hiển thị ngay ảnh khi đại biểu nhận diện Face ID / quẹt thẻ, và xuất biên bản chuyên cần sau họp.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Thư ký / Chủ trì | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) | Tạo cuộc họp: nhập tiêu đề, chọn phòng họp, thời gian và chọn đại biểu từ danh sách nhân sự | Cuộc họp ở trạng thái Sẵn sàng đón tiếp | MTG-01 |\n| 2 | Đại biểu | Cửa phòng họp | Nhận diện khuôn mặt Face ID hoặc quẹt thẻ nhân viên tại thiết bị phòng họp | Thiết bị phát tín hiệu xác nhận thành công | MTG-02 |\n| 3 | Màn hình Live | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) | Tiếp nhận sự kiện, hiển thị ngay ảnh chân dung, tên, chức danh và chuyển trạng thái đại biểu sang \"Đã vào họp\" | Màn hình Live cập nhật tức thì theo thời gian thực | MTG-02 |\n| 4 | Đại biểu | Cửa phòng họp | Xác thực khi ra ngoài giữa giờ hoặc khi cuộc họp kết thúc | Ghi nhận thời điểm rời phòng họp | MTG-03 |\n| 5 | Thư ký / Chủ trì | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) | Bấm \"Kết thúc cuộc họp\" | Chốt dữ liệu chuyên cần, hiển thị tổng hợp và nút xuất file PDF/Excel | MTG-04 |\n\n## Quy tắc chặn / validation\n- Đại biểu ngoài danh sách triệu tập khi quét thẻ vẫn được ghi nhận nhưng xếp vào nhóm \"Đại biểu bổ sung / Khách mời\".\n- Chống quét trùng lặp: Giữ bản ghi đầu tiên nếu cùng một đại biểu quét liên tiếp trong 60 giây tại phòng họp.\n- Cuộc họp sau khi đã bấm Kết thúc sẽ chuyển sang trạng thái Đã đóng (Closed), dữ liệu trở thành bất biến và tự động đồng bộ sang Bảng điều khiển báo cáo.\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| MTG-01 | P0 | Thiết lập lịch họp, phòng họp và triệu tập danh sách đại biểu | Chưa triển khai | MISSING | - |\n| MTG-02 | P0 | Màn hình Live roll-call điểm danh thời gian thực tại phòng họp | Chưa triển khai | MISSING | - |\n| MTG-03 | P0 | Điểm danh Check-out và chốt kết thúc cuộc họp | Chưa triển khai | MISSING | - |\n| MTG-04 | P0 | Xuất biên bản và báo cáo chuyên cần cuộc họp dạng PDF/Excel | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Cuộc họp](../entities/meeting.md)\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md)\n"}, {"path": "pages/overview/module-attendance.md", "title": "Chấm công vào ra", "type": "overview", "group": "overview", "fm": {"title": "Chấm công vào ra", "type": "overview", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Chấm công vào ra\n\n## Tóm tắt\nPhân hệ **Chấm công vào ra** (mã spec `ATT-NN`) quản lý việc theo dõi giờ đến và giờ về trong ngày của cán bộ nhân viên cơ quan. Phân hệ áp dụng khung giờ hành chính mặc định tinh gọn (kèm số phút dung sai đi muộn cho phép) để tự động phân loại đúng giờ, đi muộn, về sớm hoặc vắng mặt.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Quyết định kiến trúc 2026-11-02](../sources/portal-architecture-decisions-2026-11-02.md) |\n| Thực thể | [Bản ghi điểm danh](../entities/attendance-record.md) · [Ca làm việc](../entities/work-shift.md) |\n| Luồng | [Luồng chấm công vào ra cơ quan](../flows/daily-attendance-flow.md) |\n| Màn hình | [Màn hình chấm công ngày](../screens/daily-attendance-screen.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Tổ chức và nhân sự](module-organization.md)\n- [Phân hệ Bảng điều khiển báo cáo](module-dashboard.md)\n"}, {"path": "pages/overview/module-authentication.md", "title": "Xác thực và tài khoản", "type": "overview", "group": "overview", "fm": {"title": "Xác thực và tài khoản", "type": "overview", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Xác thực và tài khoản\n\n## Tóm tắt\nPhân hệ **Xác thực và tài khoản** (mã spec `AUTH-NN`) là tính năng số 1 trong lộ trình phát triển. Phân hệ quản lý việc đăng nhập của các cơ quan khách hàng (UBND phường, Doanh nghiệp/Nhà máy, Bệnh viện) bằng tài khoản do Finviet cấp phát, bảo đảm cô lập dữ liệu đa khách hàng (multi-tenancy) và hỗ trợ đổi mật khẩu.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Quyết định kiến trúc 2026-11-02](../sources/portal-architecture-decisions-2026-11-02.md) |\n| Thực thể | [Tài khoản đơn vị](../entities/tenant-account.md) |\n| Luồng | [Luồng đăng nhập và quản lý phiên](../flows/authentication-flow.md) |\n| Màn hình | [Màn hình đăng nhập](../screens/login-screen.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Tổ chức và nhân sự](module-organization.md)\n"}, {"path": "pages/overview/module-dashboard.md", "title": "Bảng điều khiển báo cáo", "type": "overview", "group": "overview", "fm": {"title": "Bảng điều khiển báo cáo", "type": "overview", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Bảng điều khiển báo cáo\n\n## Tóm tắt\nPhân hệ **Bảng điều khiển báo cáo** (mã spec `DASH-NN`) là trung tâm báo cáo phân tích dành cho lãnh đạo và quản lý cơ quan. Bảng điều khiển chỉ tổng hợp số liệu sau khi các cuộc họp đã kết thúc và báo cáo xu hướng hiện diện, tỷ lệ chuyên cần toàn cơ quan theo ngày, tuần, tháng.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Quyết định kiến trúc 2026-11-02](../sources/portal-architecture-decisions-2026-11-02.md) |\n| Thực thể | [Báo cáo chuyên cần](../entities/attendance-summary.md) |\n| Luồng | [Luồng xem báo cáo tổng hợp](../flows/dashboard-reporting-flow.md) |\n| Màn hình | [Bảng điều khiển báo cáo](../screens/attendance-dashboard.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Điểm danh cuộc họp](module-meeting.md)\n- [Phân hệ Chấm công vào ra](module-attendance.md)\n"}, {"path": "pages/overview/module-meeting.md", "title": "Điểm danh cuộc họp", "type": "overview", "group": "overview", "fm": {"title": "Điểm danh cuộc họp", "type": "overview", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Điểm danh cuộc họp\n\n## Tóm tắt\nPhân hệ **Điểm danh cuộc họp** (mã spec `MTG-NN`) là trọng tâm ưu tiên cao nhất của hệ thống. Phân hệ quản lý tạo lịch họp, triệu tập danh sách đại biểu, màn hình lớn giám sát điểm danh trực tiếp tại phòng họp (Live roll-call hiển thị ngay ảnh Face ID và quẹt thẻ) và xuất biên bản chuyên cần sau họp.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Quyết định kiến trúc 2026-11-02](../sources/portal-architecture-decisions-2026-11-02.md) |\n| Thực thể | [Cuộc họp](../entities/meeting.md) · [Bản ghi điểm danh](../entities/attendance-record.md) |\n| Luồng | [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md) |\n| Màn hình | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Tổ chức và nhân sự](module-organization.md)\n- [Phân hệ Bảng điều khiển báo cáo](module-dashboard.md)\n"}, {"path": "pages/overview/module-organization.md", "title": "Tổ chức và nhân sự", "type": "overview", "group": "overview", "fm": {"title": "Tổ chức và nhân sự", "type": "overview", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Tổ chức và nhân sự\n\n## Tóm tắt\nPhân hệ **Tổ chức và nhân sự** (mã spec `ORG-NN`) đóng vai trò nền tảng dữ liệu phục vụ điểm danh hội họp và chấm công. Phân hệ quản lý cơ cấu phòng ban, danh sách cán bộ nhân viên (hỗ trợ import Excel và nạp ảnh chân dung Face ID) và quản lý cấp phát thẻ nhân viên vật lý (RFID/NFC).\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Quyết định kiến trúc 2026-11-02](../sources/portal-architecture-decisions-2026-11-02.md) |\n| Thực thể | [Nhân viên](../entities/employee.md) · [Phòng ban](../entities/department.md) · [Thẻ nhân viên](../entities/employee-card.md) |\n| Luồng | [Luồng quản lý nhân sự](../flows/employee-management-flow.md) |\n| Màn hình | [Màn hình quản lý nhân viên](../screens/employee-management-screen.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Xác thực và tài khoản](module-authentication.md)\n- [Phân hệ Điểm danh cuộc họp](module-meeting.md)\n"}, {"path": "pages/overview/project-overview.md", "title": "Tổng quan Attendance Portal", "type": "overview", "group": "overview", "fm": {"title": "Tổng quan Attendance Portal", "type": "overview", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Tổng quan Attendance Portal\n\n## Tóm tắt\nHệ thống **Attendance Portal** (Cổng Quản trị Điểm danh & Chấm công) do Finviet phát triển là giải pháp quản lý hiện diện trực quan dành riêng cho các khách hàng là Cơ quan nhà nước / UBND xã phường, Doanh nghiệp / Nhà máy sản xuất, và Bệnh viện. Toàn bộ giao diện hệ thống tuân thủ nghiêm ngặt theo **Design System** tokenized tại `Design System/src/css.css`.\n\n## Bản đồ\n\n| Tiền tố | Phân hệ | Mô tả |\n|---|---|---|\n| `AUTH` | [Xác thực và tài khoản](module-authentication.md) | Đăng nhập tài khoản Finviet cấp, cô lập dữ liệu đơn vị, đổi mật khẩu |\n| `ORG` | [Tổ chức và nhân sự](module-organization.md) | Cơ cấu phòng ban, danh sách nhân viên (Excel/Face ID) và quản lý thẻ vật lý |\n| `MTG` | [Điểm danh cuộc họp](module-meeting.md) | Tạo cuộc họp, màn hình Live roll-call phòng họp và xuất biên bản chuyên cần |\n| `ATT` | [Chấm công vào ra](module-attendance.md) | Khung giờ hành chính chuẩn, theo dõi giờ đến/về và thống kê đi muộn |\n| `DASH` | [Bảng điều khiển báo cáo](module-dashboard.md) | Báo cáo sau họp và xu hướng chuyên cần toàn cơ quan theo ngày/tuần/tháng |\n\n## Liên quan\n\n- [Danh mục wiki](../../index.md)\n- [SCHEMA](../../SCHEMA.md)\n- [Quyết định kiến trúc 2026-11-02](../sources/portal-architecture-decisions-2026-11-02.md)\n"}, {"path": "pages/screens/attendance-dashboard.md", "title": "Bảng điều khiển báo cáo", "type": "screen", "group": "screens", "fm": {"title": "Bảng điều khiển báo cáo", "type": "screen", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["DASH-01", "DASH-02"], "apps": ["web"], "route_ids": ["/dashboard"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Bảng điều khiển báo cáo\n\n## Mục đích\nMàn hình trung tâm dành cho lãnh đạo và quản lý cơ quan theo dõi báo cáo phân tích tổng thể: danh sách các cuộc họp đã kết thúc trong kỳ và xu hướng hiện diện, tỷ lệ chuyên cần của toàn cơ quan theo ngày, tuần, tháng. Tuyệt đối không hiển thị cuộc họp đang diễn ra hay trạng thái thiết bị ngoại vi. Áp dụng các thẻ thống kê (`.stats`, `.banner`) và bảng dữ liệu theo Design System.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/dashboard` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| DASH-01 | Widget danh mục các cuộc họp đã kết thúc: Tên cuộc họp, thời gian, tỷ lệ chuyên cần trung bình, số người vắng mặt, liên kết tải nhanh biên bản họp | MISSING |\n| DASH-02 | Widget biểu đồ xu hướng hiện diện toàn cơ quan theo ngày/tuần/tháng: Tỷ lệ đúng giờ, tỷ lệ đi muộn, tỷ lệ vắng mặt và so sánh giữa các phòng ban | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| DASH-01 | P2 | Widget thống kê tổng hợp các cuộc họp đã kết thúc | Chưa triển khai | MISSING | - |\n| DASH-02 | P2 | Biểu đồ xu hướng hiện diện và chuyên cần toàn cơ quan | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Báo cáo chuyên cần](../entities/attendance-summary.md)\n- [Luồng xem báo cáo tổng hợp](../flows/dashboard-reporting-flow.md)\n- [Phân hệ Bảng điều khiển báo cáo](../overview/module-dashboard.md)\n"}, {"path": "pages/screens/daily-attendance-screen.md", "title": "Màn hình chấm công ngày", "type": "screen", "group": "screens", "fm": {"title": "Màn hình chấm công ngày", "type": "screen", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ATT-01", "ATT-02", "ATT-03"], "apps": ["web"], "route_ids": ["/attendance/daily"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Màn hình chấm công ngày\n\n## Mục đích\nMàn hình phục vụ nhân sự theo dõi tình hình vào/ra cơ quan hàng ngày của cán bộ nhân viên, xem giờ đến, giờ về, phân loại đúng giờ, đi muộn, về sớm và tùy chỉnh khung giờ hành chính chuẩn. Áp dụng bảng dữ liệu và bộ lọc theo Design System.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/attendance/daily` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| ATT-01 | Khung cấu hình Khung ca hành chính chuẩn (Giờ vào ca, tan ca, số phút dung sai đi muộn cho phép) | MISSING |\n| ATT-02 | Bảng hiển thị các lượt quét Check-in / Check-out trong ngày từ cổng cơ quan kèm phương thức (Face ID / Thẻ) | MISSING |\n| ATT-03 | Bảng theo dõi chấm công ngày: Danh sách nhân viên, giờ đến, giờ về, số phút đi muộn và nhãn trạng thái (Đúng giờ / Muộn / Vắng) | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ATT-01 | P1 | Giao diện cấu hình khung giờ ca hành chính chuẩn | Chưa triển khai | MISSING | - |\n| ATT-02 | P1 | Danh sách tiếp nhận sự kiện Check-in/Check-out hàng ngày | Chưa triển khai | MISSING | - |\n| ATT-03 | P1 | Bảng theo dõi chấm công ngày và phân loại chuyên cần | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Ca làm việc](../entities/work-shift.md)\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Luồng chấm công vào ra cơ quan](../flows/daily-attendance-flow.md)\n"}, {"path": "pages/screens/employee-management-screen.md", "title": "Màn hình quản lý nhân viên", "type": "screen", "group": "screens", "fm": {"title": "Màn hình quản lý nhân viên", "type": "screen", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["ORG-01", "ORG-02", "ORG-03"], "apps": ["web"], "route_ids": ["/employees"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Màn hình quản lý nhân viên\n\n## Mục đích\nMàn hình quản lý danh mục phòng ban, danh sách nhân sự của cơ quan, phục vụ import danh sách từ Excel, nạp ảnh chân dung Face ID và quản lý cấp phát thẻ nhân viên vật lý. Áp dụng bảng dữ liệu, tab và modal theo chuẩn Design System.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/employees` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| ORG-01 | Cây chọn và bộ lọc theo Phòng ban / Phân xưởng / Khoa phòng | MISSING |\n| ORG-02 | Bảng danh sách nhân viên, nút Import Excel, nút nạp ảnh chân dung Face ID và xem trước ảnh | MISSING |\n| ORG-03 | Modal gán mã thẻ vật lý (RFID/NFC) cho nhân viên và thao tác thu hồi / hủy thẻ khi mất | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| ORG-01 | P0 | Giao diện quản lý cây cơ cấu phòng ban | Chưa triển khai | MISSING | - |\n| ORG-02 | P0 | Bảng nhân viên, chức năng import Excel và nạp ảnh Face ID | Chưa triển khai | MISSING | - |\n| ORG-03 | P0 | Giao diện cấp phát, đổi thẻ và thu hồi thẻ vật lý | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Nhân viên](../entities/employee.md)\n- [Phòng ban](../entities/department.md)\n- [Thẻ nhân viên](../entities/employee-card.md)\n- [Luồng quản lý nhân sự](../flows/employee-management-flow.md)\n"}, {"path": "pages/screens/login-screen.md", "title": "Màn hình đăng nhập", "type": "screen", "group": "screens", "fm": {"title": "Màn hình đăng nhập", "type": "screen", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["AUTH-01", "AUTH-02"], "apps": ["web"], "route_ids": ["/login"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Màn hình đăng nhập\n\n## Mục đích\nMàn hình xác thực danh tính dành cho quản trị viên cơ quan khách hàng (UBND phường, Doanh nghiệp/Nhà máy, Bệnh viện) truy cập vào Attendance Portal bằng tài khoản Finviet cấp phát. Giao diện áp dụng bố cục form đăng nhập và màu sắc từ Design System.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/login` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| AUTH-01 | Form đăng nhập gồm ô nhập Username (hoặc Mã đơn vị) và Mật khẩu; nút \"Đăng nhập\" theo biến màu `--bl-bg`/`--focus` của Design System | MISSING |\n| AUTH-02 | Modal yêu cầu đổi mật khẩu lần đầu khi phát hiện tài khoản dùng mật khẩu mặc định của Finviet | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| AUTH-01 | P0 | Giao diện đăng nhập tài khoản đơn vị và quản lý token | Chưa triển khai | MISSING | - |\n| AUTH-02 | P0 | Modal bắt buộc đổi mật khẩu lần đầu | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Tài khoản đơn vị](../entities/tenant-account.md)\n- [Luồng đăng nhập và quản lý phiên](../flows/authentication-flow.md)\n- [Bảng điều khiển báo cáo](attendance-dashboard.md)\n"}, {"path": "pages/screens/meeting-attendance-screen.md", "title": "Màn hình điểm danh cuộc họp", "type": "screen", "group": "screens", "fm": {"title": "Màn hình điểm danh cuộc họp", "type": "screen", "sources": ["pages/sources/portal-architecture-decisions-2026-11-02.md"], "spec_ids": ["MTG-01", "MTG-02", "MTG-03", "MTG-04"], "apps": ["web"], "route_ids": ["/meetings/attendance"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Màn hình điểm danh cuộc họp\n\n## Mục đích\nMàn hình phục vụ người chủ trì cuộc họp, thư ký hoặc ban tổ chức lên lịch họp, chiếu màn hình Live roll-call tại phòng họp hiển thị ngay ảnh chân dung khi đại biểu nhận diện Face ID / quẹt thẻ và xuất biên bản chuyên cần sau họp. Áp dụng split-view panel và các thẻ đại biểu theo Design System.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/meetings/attendance` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| MTG-01 | Form tạo cuộc họp, chọn phòng họp, thời gian và chọn đại biểu theo phòng ban | MISSING |\n| MTG-02 | Chế độ Màn hình Live (Live roll-call): Hiển thị ảnh chân dung Face ID / phương thức thẻ của đại biểu vừa bước vào, cập nhật tức thì danh sách ai đã đến, ai chưa đến | MISSING |\n| MTG-03 | Nút Check-out và nút \"Kết thúc cuộc họp\", chuyển trạng thái cuộc họp sang Đã đóng | MISSING |\n| MTG-04 | Khung tổng hợp chuyên cần (% có mặt, số người đi muộn, vắng mặt) và nút xuất file PDF/Excel biên bản họp | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Ưu tiên | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|---|\n| MTG-01 | P0 | Giao diện tạo lịch họp và chọn đại biểu | Chưa triển khai | MISSING | - |\n| MTG-02 | P0 | Màn hình Live roll-call điểm danh thời gian thực kèm ảnh Face ID | Chưa triển khai | MISSING | - |\n| MTG-03 | P0 | Chức năng chốt kết thúc cuộc họp | Chưa triển khai | MISSING | - |\n| MTG-04 | P0 | Khung báo cáo chuyên cần và xuất biên bản cuộc họp | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Cuộc họp](../entities/meeting.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n- [Bảng điều khiển báo cáo](attendance-dashboard.md)\n"}, {"path": "pages/sources/initial-requirements.md", "title": "Yêu cầu khởi tạo Attendance Portal", "type": "source", "group": "sources", "fm": {"title": "Yêu cầu khởi tạo Attendance Portal", "type": "source", "sources": ["raw/specs/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Yêu cầu khởi tạo Attendance Portal\n\n## Thông tin nguồn\n| Trường | Giá trị |\n|---|---|\n| Đường dẫn | `raw/specs/initial-requirements.md` |\n| Người cung cấp | Product Owner |\n| Ngày | 2026-11-02 |\n| Loại | PRD / Yêu cầu khởi tạo |\n\n## Nội dung chính\n- Xác định phạm vi nghiệp vụ của Attendance Portal áp dụng cho: Uỷ ban nhân dân cấp phường, cơ quan hành chính nhà nước; công ty doanh nghiệp, nhà máy; bệnh viện (loại trừ trường học).\n- Xác lập 2 phân hệ chấm công:\n  1. Điểm danh cuộc họp trong giờ làm việc (ưu tiên triển khai trước).\n  2. Chấm công vào/ra cơ quan hàng ngày.\n- Tích hợp thiết bị thu thập dữ liệu phần cứng: Camera Hikvision (Face ID, Vân tay) và Thẻ nhân viên vật lý.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Ưu tiên | Quy tắc (kiểm được) | Nguồn (dòng/mục) |\n|---|---|---|---|\n| MTG-01 | P0 | Quản lý thiết lập thông tin cuộc họp (chủ đề, phòng họp, thời gian bắt đầu, kết thúc, danh sách đại biểu dự kiến) | §2 |\n| MTG-02 | P0 | Ghi nhận Check-in vào cuộc họp qua Face ID, Vân tay hoặc Thẻ vật lý, lưu vết mốc thời gian và độ tin cậy | §2, §3 |\n| MTG-03 | P0 | Ghi nhận Check-out rời phòng họp khi tan họp hoặc ra ngoài giữa giờ | §2 |\n| MTG-04 | P0 | Tổng hợp báo cáo hiện diện cuộc họp thời gian thực (đúng giờ, muộn, vắng mặt không phép/có phép) | §2 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Toàn bộ danh mục tính năng chi tiết, phân hệ và quy chuẩn Design System đã được chuẩn hóa chính thức tại [Quyết định kiến trúc 2026-11-02](portal-architecture-decisions-2026-11-02.md).\n\n## Trang chịu ảnh hưởng\n- [Cuộc họp](../entities/meeting.md)\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Nhân viên](../entities/employee.md)\n- [Tài khoản đơn vị](../entities/tenant-account.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n- [Luồng chấm công hàng ngày](../flows/daily-attendance-flow.md)\n- [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md)\n- [Bảng điều khiển điểm danh](../screens/attendance-dashboard.md)\n"}, {"path": "pages/sources/portal-architecture-decisions-2026-11-02.md", "title": "Quyết định Kiến trúc & Danh mục Tính năng 2026-11-02", "type": "source", "group": "sources", "fm": {"title": "Quyết định Kiến trúc & Danh mục Tính năng 2026-11-02", "type": "source", "sources": ["raw/specs/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Quyết định Kiến trúc & Danh mục Tính năng 2026-11-02\n\n## Thông tin nguồn\n| Trường | Giá trị |\n|---|---|\n| Đường dẫn | Trao đổi trực tiếp với Product Owner |\n| Người cung cấp | Product Owner |\n| Ngày | 2026-11-02 |\n| Loại | Quyết định kiến trúc & chốt phạm vi tính năng |\n\n## Nội dung chính\n- **Mục tiêu hệ thống**: Cổng chuyên biệt dành cho khách hàng là Cơ quan nhà nước/UBND, Doanh nghiệp/Nhà máy, Bệnh viện (loại trừ trường học).\n- **Phân tách trách nhiệm hệ thống**:\n  - Cổng ECO Card nội bộ: Finviet quản lý thiết bị camera Hikvision, cấu hình kết nối và nạp thẻ gốc.\n  - Cổng Attendance Portal (Client-facing): Khách hàng đăng nhập quản trị nhân sự, điểm danh cuộc họp, theo dõi chấm công và xem báo cáo.\n- **Quy chuẩn giao diện bắt buộc**: Toàn bộ hệ thống frontend bắt buộc áp dụng Design System chuẩn tại thư mục `Design System/` (biến CSS màu sắc, typography, dark/light mode, components, layout).\n- **Tinh giản kiến trúc**: Bỏ phân hệ Nhật ký rời và phân hệ Thiết bị riêng; tích hợp nhật ký/báo cáo trực tiếp vào từng phân hệ; loại bỏ các tính năng bán hàng/POS/Ecopay của trường học.\n\n## Quyết định\n| Câu hỏi | Phương án chọn | Phương án bị loại | Người quyết | Cách chốt | Gỡ chặn |\n|---|---|---|---|---|---|\n| Bảng điều khiển (Dashboard) hiển thị những gì? | Chỉ tổng hợp báo cáo khi cuộc họp đã kết thúc và báo cáo hiện diện toàn cơ quan. | Hiển thị trạng thái camera Hikvision và cuộc họp đang diễn ra. | Product Owner | Trực tiếp | DASH-01, DASH-02 |\n| Chấm công vào ra có cần xoay ca phức tạp không? | Áp dụng khung giờ hành chính mặc định (Sáng 07:30 - 11:30, Chiều 13:30 - 17:00, dung sai 10 phút), cho phép đơn vị chỉnh giờ. | Phân ca xoay ca đa kíp phức tạp. | Product Owner | Trực tiếp | ATT-01 |\n| Tính năng đầu tiên cần phát triển là gì? | Đăng nhập bằng tên đăng nhập và mật khẩu do Finviet cấp phát riêng cho từng đơn vị. | Làm ngay màn hình điểm danh hoặc import nhân sự khi chưa có auth. | Product Owner | Trực tiếp | AUTH-01 |\n| Nguồn quy chuẩn thiết kế UI/UX? | Bắt buộc tuân thủ token và component trong thư mục `Design System/`. | Tự ý dùng thư viện UI bên ngoài lệch chuẩn. | Product Owner | Trực tiếp | Toàn bộ Screens |\n\n## Mã yêu cầu được định nghĩa\n| Mã | Ưu tiên | Quy tắc (kiểm được) | Nguồn (dòng/mục) |\n|---|---|---|---|\n| AUTH-01 | P0 | Đăng nhập tài khoản đơn vị với username và mật khẩu do Finviet cấp; cô lập dữ liệu đa khách hàng (multi-tenant) | Quyết định PO |\n| AUTH-02 | P0 | Quản trị phiên làm việc, đổi mật khẩu lần đầu và hiển thị thông tin hồ sơ cơ quan | Quyết định PO |\n| ORG-01 | P0 | Quản lý cơ cấu phòng ban / đơn vị (Khối/Phòng/Ban, Phân xưởng/Tổ đội, Khoa/Phòng khám) | Quyết định PO |\n| ORG-02 | P0 | Quản lý danh sách nhân sự, gắn phòng ban, chức vụ, import Excel và nạp ảnh chân dung Face ID | Quyết định PO |\n| ORG-03 | P0 | Quản lý cấp phát và liên kết mã thẻ nhân viên vật lý (RFID/NFC) vào hồ sơ nhân sự | Quyết định PO |\n| MTG-01 | P0 | Lên lịch cuộc họp, chọn phòng họp, thời gian và triệu tập danh sách đại biểu bắt buộc/tùy chọn | Quyết định PO |\n| MTG-02 | P0 | Màn hình Điểm danh Trực tiếp tại phòng họp (Live roll-call qua camera Face ID / Thẻ với ảnh đối soát tức thì) | Quyết định PO |\n| MTG-03 | P0 | Điểm danh Check-out rời phòng họp, chốt kết thúc cuộc họp và tính thời gian tham gia thực tế | Quyết định PO |\n| MTG-04 | P0 | Tổng hợp chuyên cần cuộc họp (% tham gia, muộn, vắng) và xuất file PDF/Excel biên bản cuộc họp | Quyết định PO |\n| ATT-01 | P1 | Cấu hình khung giờ ca làm việc chuẩn (mặc định giờ hành chính, số phút dung sai đi muộn cho phép) | Quyết định PO |\n| ATT-02 | P1 | Tiếp nhận sự kiện Check-in đầu ngày và Check-out tan ca từ cổng cơ quan qua camera / thẻ | Quyết định PO |\n| ATT-03 | P1 | Bảng theo dõi Chấm công Ngày và phân loại Đúng giờ / Đi muộn / Về sớm / Vắng mặt | Quyết định PO |\n| DASH-01 | P2 | Báo cáo tổng hợp danh sách các cuộc họp đã kết thúc và tỷ lệ chuyên cần trung bình | Quyết định PO |\n| DASH-02 | P2 | Báo cáo tổng hợp xu hướng hiện diện và tỷ lệ đi làm chuyên cần toàn cơ quan theo ngày/tuần/tháng | Quyết định PO |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Nguồn quyết định này thay thế và định hình lại toàn bộ danh mục tính năng ban đầu, chuyển từ tiền tố CC, TB, NV sang hệ thống 5 phân hệ chuẩn: `AUTH`, `ORG`, `MTG`, `ATT`, `DASH`.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan Attendance Portal](../overview/project-overview.md)\n- [Xác thực và tài khoản](../overview/module-authentication.md)\n- [Tổ chức và nhân sự](../overview/module-organization.md)\n- [Điểm danh cuộc họp](../overview/module-meeting.md)\n- [Chấm công vào ra](../overview/module-attendance.md)\n- [Bảng điều khiển báo cáo](../overview/module-dashboard.md)\n"}], "edges": [[0, 1], [0, 2], [1, 17], [1, 18], [1, 19], [1, 20], [1, 21], [2, 0], [2, 1], [2, 3], [2, 4], [2, 5], [2, 6], [2, 7], [2, 8], [2, 9], [2, 10], [2, 11], [2, 12], [2, 13], [2, 14], [2, 15], [2, 16], [2, 17], [2, 18], [2, 19], [2, 20], [2, 21], [2, 22], [2, 23], [2, 24], [2, 25], [2, 26], [2, 27], [2, 28], [2, 29], [4, 8], [4, 9], [4, 11], [4, 17], [4, 20], [5, 4], [5, 9], [5, 10], [5, 19], [5, 23], [6, 8], [6, 10], [6, 21], [6, 25], [7, 4], [7, 8], [7, 21], [7, 25], [8, 4], [8, 6], [8, 7], [8, 9], [8, 21], [8, 25], [9, 4], [9, 5], [9, 8], [9, 10], [9, 16], [9, 20], [9, 27], [10, 6], [10, 8], [10, 9], [10, 11], [10, 12], [10, 18], [10, 26], [11, 4], [11, 10], [11, 17], [11, 24], [12, 10], [12, 18], [12, 26], [13, 4], [13, 11], [13, 24], [14, 5], [14, 19], [14, 23], [15, 6], [15, 7], [15, 8], [15, 25], [16, 4], [16, 9], [16, 27], [17, 4], [1 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 t=t.replace(/\[\[([^\]|#]+)[^\]]*\]\]/g,(m,x)=>{const p=byPath['pages/'+x.trim()]!==undefined?'pages/'+x.trim():(byPath[x.trim()]!==undefined?x.trim():null);return p?'<a href="#'+encodeURIComponent(p)+'">'+esc(x.trim())+'</a>':m});

function md(src,from){const L=src.split('\n'),out=[];let i=0;
 while(i<L.length){let l=L[i];
  if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
  let m=l.match(/^(#{1,6})\s+(.*)$/);if(m){out.push('<h'+m[1].length+'>'+inline(m[2],from)+'</h'+m[1].length+'>');i++;continue}
  if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);let h='<table>';
   rows.forEach((r,ri)=>{if(/^\s*\|[\s:|-]+\|\s*$/.test(r))return;const cells=r.trim().replace(/^\||\|$/g,'').split('|');const tg=ri===0?'th':'td';
    h+='<tr>'+cells.map(c=>{c=c.trim();const k=c.replace(/[`*]/g,'');return '<'+tg+'>'+(LEVELS.includes(k)?'<span class="tag L-'+k+'">'+k+'</span>':inline(c,from))+'</'+tg+'>'}).join('')+'</tr>'});
   out.push(h+'</table>');continue}
  if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ord=/^\s*\d+\./.test(l),items=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i]))items.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
   out.push((ord?'<ol>':'<ul>')+items.map(x=>'<li>'+inline(x,from)+'</li>').join('')+(ord?'</ol>':'</ul>'));continue}
  if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote>'+inline(b.join(' '),from)+'</blockquote>');continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push('<hr>');i++;continue}
  if(!l.trim()){i++;continue}
  const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|```|\s*\||\s*([-*]|\d+\.)\s+|>)/.test(L[i]))p.push(L[i++]);out.push('<p>'+inline(p.join(' '),from)+'</p>')}
 return out.join('\n')}
