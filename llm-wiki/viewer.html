<script>
const LIVE=false;let DATA={"meta": {"name": "Attendance Portal", "mode": "new", "pages": 14, "notes": 18, "links": 100, "gaps": {"gap": {"MISSING": 28}}, "open": 3, "generated": "2026-11-02 15:08", "bodies": true}, "nodes": [{"path": "OBSIDIAN.md", "title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "group": "root", "fm": {"title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "sources": ["SCHEMA.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Mở wiki bằng Obsidian để xem graph\n\nThư mục `llm-wiki/` là một **Obsidian vault** đã cấu hình sẵn trong `.obsidian/`. Trong mẫu LLM Wiki, vai trò được chia như sau: Obsidian là IDE, LLM là lập trình viên, còn wiki là codebase.\n\n## Tóm tắt\n\n1. Cài Obsidian: `brew install --cask obsidian` (macOS), hoặc tải từ obsidian.md.\n2. Mở vault: Obsidian → **Open folder as vault** → chọn `Attendance Portal/llm-wiki`.\n3. Xem graph: `Cmd+G`. Mở một trang rồi chạy **Open local graph** để xem các trang quanh nó.\n\n## Bản đồ\n\n| Màu node | Nhóm | Thư mục |\n|---|---|---|\n| Đỏ cam | Tổng quan | `pages/overview/` |\n| Cam | Luồng nghiệp vụ | `pages/flows/` |\n| Xanh dương | Màn hình | `pages/screens/` |\n| Xanh lá | Thực thể | `pages/entities/` |\n| Tím | Khái niệm | `pages/concepts/` |\n| Xám | Nguồn đã ingest | `pages/sources/` |\n| Xám nhạt | Nguồn thô | `raw/` |\n| Đen | Điều hướng | `index.md`, `log.md`, `SCHEMA.md`, file này |\n\nCấu hình đặt sẵn:\n- Dùng link markdown tương đối, không dùng `[[wikilink]]`, khớp SCHEMA §4.3.\n- Trang mới tạo vào `pages/`; ảnh dán vào lưu ở `raw/assets/`.\n- Graph ẩn thư mục `tools/`, ẩn file đính kèm và link chưa có đích.\n- `workspace.json` (bố cục cửa sổ cá nhân) bị git bỏ qua. Các file cấu hình còn lại được commit, để cả nhóm thấy cùng một graph.\n\n## Quy tắc khi sửa trong Obsidian\n\n- Wiki do LLM sở hữu. Bạn ghi chú được, nhưng nên nhờ LLM ingest để `index.md`, `log.md` và các liên kết được cập nhật đồng bộ (SCHEMA §6).\n- **Không sửa `raw/`.**\n- Sau khi sửa tay, chạy lint: `python3 -I tools/lint_wiki.py .`\n\n## Liên quan\n\n- [Danh mục wiki](index.md)\n- [SCHEMA](SCHEMA.md)\n"}, {"path": "SCHEMA.md", "title": "SCHEMA — LLM Wiki của dự án Attendance Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 3, "body": "# SCHEMA — LLM Wiki của dự án Attendance Portal\n\n> Đây là bản thể hiện của mẫu \"LLM Wiki\" (Karpathy, gist `karpathy/442a6bf555914893e9891c11519de94f`) cho repo này. Wiki được dựng bằng skill `llm-wiki`, chế độ **new**.\n> File này là **cấu hình**: nó cho mọi agent LLM biết wiki có cấu trúc ra sao, quy ước viết trang và quy trình Ingest / Query / Lint. Bản máy đọc nằm ở `wiki.json`; `tools/lint_wiki.py` đọc file đó.\n> Người và LLM cùng chỉnh file này theo thời gian. Ngày khởi tạo: 2026-11-02.\n\n## 1. Mục đích\n\n- `llm-wiki/pages/` là **đặc tả (spec) và tài liệu sống** của những gì Attendance Portal PHẢI làm. Wiki tổng hợp từ nguồn nghiệp vụ (tài liệu BA, PRD, spec sheet, quyết định của chủ sở hữu).\n- Tính năng mới được đặc tả ở đây trước, rồi mới vào backlog của harness. Harness trỏ `sources.spec.root` vào `llm-wiki/pages/`.\n\n- Dự án **mới**: chưa có code, hoặc code mới bắt đầu. Phần thân trang mô tả hành vi **mong muốn** đã được chủ sở hữu duyệt, ghi rõ nguồn quyết định.\n- Bảng `## Khác biệt spec ↔ code` đóng vai trò **bảng theo dõi triển khai**. Ban đầu mọi mã là `MISSING`; khi code xong và verify xanh thì chuyển sang `OK`, kèm bằng chứng `repo:path:line`.\n\n- Ngôn ngữ: **tiếng Việt**. Giữ nguyên tên định danh: page id, tên file code, tên trường, enum, tên package.\n\n## 2. Ba lớp\n\n| Lớp | Đường dẫn | Ai sở hữu | Quy tắc |\n|---|---|---|---|\n| Nguồn thô (raw) | `llm-wiki/raw/` | Người dùng | **Bất biến.** LLM chỉ đọc, không sửa. Thêm nguồn mới thì thêm file mới. |\n| Wiki | `llm-wiki/pages/` | LLM | LLM tạo và sửa toàn bộ. Người đọc và góp ý. |\n| Schema | `llm-wiki/SCHEMA.md` + `wiki.json` | Người + LLM | Chỉ sửa khi đã thống nhất quy ước mới, và ghi lại thay đổi trong `log.md`. |\n\nTệp điều hướng: `llm-wiki/index.md` là danh mục theo nội dung; `llm-wiki/log.md` là nhật ký theo thời gian, chỉ ghi thêm.\n\n**Vault độc lập:** `llm-wiki/` là một Obsidian vault riêng, chỉ chứa tri thức của Attendance Portal. Không liên kết, không copy trang, không dùng chung `.obsidian/` với wiki của dự án khác. Chỉ được mượn **khuôn** (schema, tools), không mượn **nội dung**. Mọi link phải trỏ vào bên trong `llm-wiki/`, hoặc dùng tiền tố `repo:` cho file của repo này.\n\n## 3. Cấu trúc thư mục\n\n```\nllm-wiki/\n├── SCHEMA.md     ← file này\n├── wiki.json     ← cấu hình máy đọc: chế độ, tiền tố mã spec, mục bắt buộc\n├── OBSIDIAN.md   ← cách mở vault và xem graph\n├── index.md      ← danh mục mọi trang (LLM cập nhật mỗi lần ingest)\n├── log.md        ← nhật ký append-only (ingest | query | lint | decide)\n├── tools/        ← lint_wiki.py, obsidian_graph.py\n├── raw/          ← nguồn bất biến KHÔNG nằm sẵn trong repo\n│   ├── specs/    ← spreadsheet / tài liệu yêu cầu (bản gốc + export nguyên văn)\n│   └── assets/   ← ảnh dán vào từ Obsidian\n└── pages/        ← wiki do LLM sở hữu (= spec root của harness)\n    ├── overview/ ← type: overview — bức tranh tổng, hub từng phân hệ, phân quyền\n    ├── sources/  ← type: source   — tóm tắt từng nguồn đã ingest, trang quyết định\n    ├── entities/ ← type: entity   — đối tượng nghiệp vụ\n    ├── concepts/ ← type: concept  — quy tắc hoặc khái niệm xuyên phân hệ\n    ├── flows/    ← type: flow     — luồng nghiệp vụ nhiều bước\n    └── screens/  ← type: screen   — màn hình / route; ánh xạ spec → route trong code\n```\n\nKhi code bắt đầu có, tham chiếu bằng tiền tố `repo:`, ví dụ `repo:src/orders/service.ts:42`. Không copy code vào `raw/`.\n\n## 4. Quy ước trang\n\n### 4.1 Frontmatter YAML (bắt buộc)\n\n```yaml\n---\ntitle: Đơn hàng                 # tên hiển thị\ntype: entity                    # overview | source | entity | concept | flow | screen\nsources:                        # nguồn căn cứ: đường dẫn tương đối từ llm-wiki/ hoặc repo:<path>\n  - raw/specs/01-yeu-cau.md\nupdated: 2026-11-02               # ngày LLM sửa gần nhất (YYYY-MM-DD)\n---\n```\n\nTrường tuỳ chọn:\n- `spec_ids`: danh sách mã yêu cầu, xem §5.\n- `apps`: các app liên quan.\n- `route_ids`: chỉ cho `screen`.\n- `status` (`implemented | partial | missing | extra`): chỉ cho `screen`.\n- `aliases`.\n\n### 4.2 Đặt tên file\n\n- Tên file: **tiếng Anh**, `kebab-case`, ngắn và gợi tả, ví dụ `sales-order.md`, `outlet-debt.md`, `order-list.md`. Tiêu đề (`title:`) viết bằng ngôn ngữ của wiki.\n- File dẫn hướng có tên cố định: `pages/overview/project-overview.md` (tổng quan), `pages/overview/module-<tên>.md` (hub từng phân hệ), `pages/sources/<module>-decisions-YYYY-MM-DD.md` (quyết định).\n- Một khái niệm là một trang. Trước khi tạo trang mới, tìm trong `index.md` xem đã có chưa.\n- Đặt tên screen theo nghiệp vụ, không theo tên component.\n- Mỗi trang tối đa 600 dòng; dài hơn thì tách thành trang con.\n\n### 4.3 Liên kết\n\n- Dùng **link markdown tương đối**, ví dụ `[Đơn hàng](../entities/sales-order.md)`. Không dùng wikilink `[[...]]`, để file hiển thị đúng trên GitHub/GitLab và để harness đọc được.\n  - Ngoại lệ duy nhất: block `<!-- ai-po:<FID> begin … end -->` do harness (AI PO) chèn vào trang spec dùng `[[proposals/ai-po-<FID>.md]]`, đường dẫn tính từ `pages/`. Đó là vùng của harness: không sửa tay bên trong; muốn lật quyết định thì xoá cả block. Lint chấp nhận block này nhưng vẫn kiểm bản ghi có tồn tại.\n- Mỗi trang phải có ít nhất **một liên kết đến** từ trang khác. Trang tổng quan `overview/project-overview.md` được miễn quy tắc này.\n- Trang `source` kết thúc bằng mục `## Trang chịu ảnh hưởng`; mọi loại trang còn lại kết thúc bằng `## Liên quan`.\n\n### 4.4 Mục bắt buộc theo loại\n\n| type | Mục bắt buộc (theo thứ tự) |\n|---|---|\n| `overview` | Tóm tắt · Bản đồ · Liên quan |\n| `source` | Thông tin nguồn · Nội dung chính · Mã yêu cầu được định nghĩa (nếu là spec) · Điểm đáng chú ý / mâu thuẫn · Trang chịu ảnh hưởng |\n| `entity` | Định nghĩa · Thuộc tính / quy tắc nghiệp vụ (kèm mã spec) · Quan hệ · Khác biệt spec ↔ code · Liên quan |\n| `concept` | Định nghĩa · Quy tắc · Áp dụng ở đâu · Khác biệt spec ↔ code · Liên quan |\n| `flow` | Mục tiêu · Các bước (có vai trò và app) · Quy tắc chặn / validation · Khác biệt spec ↔ code · Liên quan |\n| `screen` | Mục đích · App / route / file code · Yêu cầu spec · Khác biệt spec ↔ code · Câu hỏi mở (nếu có) · Liên quan |\n\nMẫu từng loại trang: `references/page-templates.vi.md` của skill `llm-wiki`.\n\n### 4.5 Mục `## Khác biệt spec ↔ code`\n\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n\nCột `Mức` nhận một trong các giá trị:\n- `MISSING`: chưa có.\n- `PARTIAL`: có một phần.\n- `CONTRADICTS`: làm khác spec.\n- `BUG`: định làm đúng nhưng lỗi.\n- `EXTRA`: code có, spec không yêu cầu.\n- `OK`: khớp spec.\n\nCột `Bằng chứng` ghi `repo:path:line` theo snapshot của ngày trong `updated`. Số dòng có thể trôi, nên lint kiểm lại. Với mức `MISSING` khi chưa có code, bằng chứng ghi `—`.\n\n### 4.7 Đánh dấu chưa rõ\n\n- Chỗ spec mơ hồ hoặc tự mâu thuẫn: ghi `**[CẦN LÀM RÕ]**` kèm mô tả, và liệt kê trong mục `## Câu hỏi mở`.\n- Không tự bịa quy tắc nghiệp vụ.\n\n## 5. Mã yêu cầu (spec IDs) và thứ tự ưu tiên nguồn\n\nMỗi phân hệ có một tiền tố; mã có dạng `PREFIX-NN`, tăng dần và không tái dùng số. Một mã là một quy tắc nghiệp vụ kiểm được.\n- Mã được định nghĩa trong trang source chính của phân hệ, ở mục \"Mã yêu cầu được định nghĩa\".\n- Trang nào dùng mã thì ghi mã đó vào frontmatter `spec_ids`.\n\nDanh sách tiền tố cũng nằm trong `wiki.json → prefixes`; khi thêm tiền tố thì sửa cả hai chỗ.\n\n| Tiền tố | Phân hệ | Hub |\n|---|---|---|\n| `MTG` | Điểm danh cuộc họp | [Điểm danh cuộc họp](pages/overview/module-meeting.md) |\n| `CC` | Chấm công vào ra | [Chấm công vào ra](pages/overview/module-daily-attendance.md) |\n| `TB` | Thiết bị và tích hợp | [Thiết bị và tích hợp](pages/overview/module-device-integration.md) |\n| `NV` | Tổ chức và nhân sự | [Tổ chức và nhân sự](pages/overview/module-organization.md) |\n\n**Quyết định của chủ sở hữu:**\n- Ghi vào trang source riêng `sources/<module>-decisions-YYYY-MM-DD.md`, rồi cập nhật các mã liên quan.\n- Trang mới hơn thắng.\n- Câu được chốt theo phương án AI đề xuất thì đánh dấu \"chốt theo đề xuất\", để chủ sở hữu duyệt lại sau.\n\n**Thứ tự ưu tiên khi nguồn mâu thuẫn:**\n\n1. Quyết định của chủ sở hữu (trang `*-decisions-*` mới nhất).\n2. tài liệu yêu cầu trong raw/specs/ (bản mới hơn thắng)\n3. Tài liệu phái sinh, ví dụ PRD do AI viết.\n\nCode (khi đã có) chỉ là bằng chứng triển khai, không phải spec. Code khác spec thì ghi vào `Khác biệt spec ↔ code`.\n\nMâu thuẫn phải được ghi ở cả hai trang liên quan và trong kết quả lint.\n\n## 6. Quy trình\n\n### 6.1 Ingest (nạp nguồn mới)\n\n1. Người dùng thả nguồn vào `raw/`, hoặc chỉ định file trong repo. Với spreadsheet: lưu bản gốc, cùng export từng tab ra `.csv` và `.md` nguyên văn, không sửa nội dung.\n\n2. LLM đọc toàn bộ nguồn, tách thành các quy tắc kiểm được và đặt mã spec. Chỗ nào chưa rõ thì ghi `[CẦN LÀM RÕ]`, không tự quyết.\n\n3. Tạo hoặc cập nhật **một trang source cho mỗi nguồn** trong `pages/sources/` (không gộp nhiều tài liệu vào một trang), định nghĩa mã spec mới nếu có.\n4. Cập nhật mọi trang entity, concept, flow, screen bị ảnh hưởng. Khi thông tin mới mâu thuẫn với trang cũ: không xoá, mà ghi rõ mâu thuẫn và nguồn nào thắng theo §5.\n5. Cập nhật bảng `Khác biệt spec ↔ code` của các trang liên quan.\n6. Cập nhật `index.md`: thêm trang mới, sửa mô tả một dòng. Cập nhật `updated:` của mọi trang đã sửa.\n7. Ghi thêm entry vào `log.md` theo dạng `## [YYYY-MM-DD] ingest | <Tên nguồn>`, kèm danh sách trang đã tạo hoặc sửa.\n8. Chạy lint (§6.3) và sửa cho sạch trước khi báo xong. Khi `wiki.json` có khối `coverage`, \"sạch\" gồm cả độ phủ: **0 lỗi cấu trúc ≠ đã phủ**.\n\n### 6.2 Query (hỏi đáp)\n\n1. Đọc `index.md` trước, chọn trang liên quan rồi đọc sâu. Chỉ quay về `raw/`, tài liệu repo hoặc code khi wiki thiếu.\n2. Trả lời kèm link trang wiki và mã spec.\n3. Câu trả lời có giá trị lâu dài (so sánh, phân tích, bảng tra) thì lưu thành trang mới, thường là `concept` hoặc `overview`, và cập nhật `index.md`.\n4. Ghi `## [YYYY-MM-DD] query | <Câu hỏi ngắn>` vào `log.md`.\n\n### 6.3 Lint (kiểm tra sức khoẻ)\n\n```bash\npython3 -I tools/lint_wiki.py .          # chạy từ trong llm-wiki/; thoát 1 nếu có lỗi\npython3 -I tools/lint_wiki.py . --json   # số liệu máy đọc: khoảng trống, câu hỏi mở, độ phủ mã\npython3 -I tools/obsidian_graph.py .     # graph như Obsidian thấy\n```\n\nScript kiểm frontmatter, link hỏng, anchor, trang mồ côi, trang thiếu trong index, mục bắt buộc, wikilink, độ dài trang, định dạng log, mã spec lạ, bằng chứng `repo:` trỏ tới file không tồn tại, và chuỗi giống secret.\n\n**Độ phủ code ↔ wiki** (khi `wiki.json` có khối `coverage`; lint tự gọi `tools/coverage_wiki.py`):\n\n```bash\npython3 -I tools/coverage_wiki.py . --unclaimed --owner <PREFIX>   # fact chưa mô tả — đầu vào brief ingest\npython3 -I tools/coverage_wiki.py . --accept                       # người duyệt: khoá dấu vân tay claim đã kiểm\npython3 -I tools/coverage_wiki.py . --baseline                     # lần đầu: chụp nợ cũ; về sau: chỉ co lại\n```\n\n- **Fact** = một symbol có tên tạo/đổi/xoá một subject (bảng…), id `verb:kind:name@path#symbol`, kèm dấu vân tay\n  (cột + literal được ghi). Kho fact tính lại mỗi lần từ code, không commit.\n- **Lỗi:** fact bắt buộc chưa claim · claim trỏ fact không còn · bằng chứng ngoài thân symbol / là dòng import / dải\n  quá dài · mã spec không thuộc chủ · claim đặt ở trang không thuộc chủ · dấu vân tay đổi so với lần `--accept`\n  · lần nhắc bảng chưa phân loại · subject chưa khai báo chủ · dòng gap `OK`/`PARTIAL`/`CONTRADICTS` không trỏ fact\n  sống nào · baseline có id mới so với merge-base/HEAD hoặc quá hạn · exclusion thiếu chữ ký người.\n- **File quyết định** `wiki.json`, `coverage/{exclusions,baseline,renames,claims.lock}.json` do người duyệt đổi\n  (hook chặn agent); mọi thay đổi so với git HEAD được in trong báo cáo.\n- **Chưa phủ theo thiết kế** (chỉ đếm, không phải lỗi): SQL chỉ đọc, cron/queue, cache/Redis, HTTP ra ngoài.\n\nLLM kiểm thêm phần script không làm được:\n- mâu thuẫn giữa các nguồn và giữa các trang;\n- số dòng trong bằng chứng đã trôi;\n- tài liệu ghi \"Done\" mà code chưa có;\n- khái niệm được nhắc nhiều mà chưa có trang.\n\nGhi kết quả vào `log.md` theo dạng `## [YYYY-MM-DD] lint | <Phạm vi>`, gồm các mục Orphans / Mâu thuẫn / Khoảng trống / Việc cần làm.\n\n### 6.4 Decide (ghi quyết định)\n\n1. Chủ sở hữu trả lời câu hỏi mở.\n2. LLM ghi câu trả lời vào `sources/<module>-decisions-YYYY-MM-DD.md`: câu hỏi, phương án được chọn, các phương án bị loại, người quyết định, các trang và feature bị ảnh hưởng.\n3. Cập nhật các trang liên quan; bỏ `[CẦN LÀM RÕ]` ở chỗ đã chốt.\n4. Ghi `## [YYYY-MM-DD] decide | <Phạm vi>` vào `log.md`.\n\n## 7. Quy tắc `index.md` và `log.md`\n\n- `index.md` nhóm trang theo loại (Overview, Sources, Entities, Concepts, Flows, Screens).\n  - Mỗi dòng có dạng `- [Tiêu đề](pages/...md) — mô tả một dòng`.\n  - Trang screen thêm ` · status` ở cuối dòng.\n- `log.md` là **append-only**, mới nhất ở cuối.\n  - Mỗi entry bắt đầu đúng dạng `## [YYYY-MM-DD] ingest|query|lint|decide | Tiêu đề`, để `grep` được.\n  - Không sửa entry cũ. Ghi sai thì ghi entry mới để đính chính.\n\n## 8. Ràng buộc với phần còn lại của repo\n\n- Khi làm việc với wiki, không sửa code app, thư mục harness, skill, tệp chỉ dẫn agent gốc (`AGENTS.md`, `GEMINI.md`, `CLAUDE.md`…), trừ khi người dùng yêu cầu riêng.\n- Wiki mô tả yêu cầu. Sửa code cho khớp spec là nhiệm vụ riêng: lấy bảng `Khác biệt spec ↔ code` làm nguồn backlog cho harness (AGY-Harness Kit: `agy-harness-ingest`).\n- Không ghi secret (mật khẩu, token, khoá) vào wiki. Chỉ ghi `file:line` và loại secret.\n"}, {"path": "index.md", "title": "Danh mục — LLM Wiki Attendance Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# Danh mục — LLM Wiki Attendance Portal\n\n> Mỗi dòng: `- [Tiêu đề](pages/...md) — mô tả một dòng`. Cập nhật mỗi lần ingest (SCHEMA §7).\n\n## Điều hướng\n\n- [SCHEMA](SCHEMA.md) — quy ước của wiki\n- [Mở bằng Obsidian](OBSIDIAN.md) — xem graph\n- [Nhật ký](log.md) — ingest/query/lint/decide\n\n## Overview\n\n- [Tổng quan Attendance Portal](pages/overview/project-overview.md) — bức tranh tổng quan hệ thống\n- [Điểm danh cuộc họp](pages/overview/module-meeting.md) — phân hệ điểm danh cuộc họp\n- [Chấm công vào ra](pages/overview/module-daily-attendance.md) — phân hệ chấm công vào ra cơ quan\n- [Thiết bị và tích hợp](pages/overview/module-device-integration.md) — phân hệ thiết bị và tích hợp\n- [Tổ chức và nhân sự](pages/overview/module-organization.md) — phân hệ tổ chức và nhân sự\n\n## Sources\n\n- [Yêu cầu khởi tạo Attendance Portal](pages/sources/initial-requirements.md) — yêu cầu khởi tạo từ Product Owner\n\n## Entities\n\n- [Cuộc họp](pages/entities/meeting.md) — cuộc họp, phòng họp và danh sách đại biểu\n- [Bản ghi điểm danh](pages/entities/attendance-record.md) — sự kiện điểm danh qua camera Hikvision và thẻ vật lý\n- [Nhân viên](pages/entities/employee.md) — hồ sơ nhân sự, mã thẻ và mẫu sinh trắc học\n- [Thiết bị](pages/entities/device.md) — camera nhận diện khuôn mặt Hikvision và đầu đọc thẻ\n\n## Flows\n\n- [Luồng điểm danh cuộc họp](pages/flows/meeting-attendance-flow.md) — quy trình điểm danh check-in/out cuộc họp\n- [Luồng chấm công vào ra cơ quan](pages/flows/daily-attendance-flow.md) — quy trình chấm công đầu/cuối ngày\n\n## Screens\n\n- [Màn hình điểm danh cuộc họp](pages/screens/meeting-attendance-screen.md) — màn hình giám sát và xuất biên bản cuộc họp\n- [Bảng điều khiển điểm danh](pages/screens/attendance-dashboard.md) — bảng điều khiển tổng quan hiện diện cơ quan\n"}, {"path": "log.md", "title": "Log — LLM Wiki Attendance Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# Log — LLM Wiki Attendance Portal\n\n> Append-only, mới nhất ở cuối. Định dạng: `## [YYYY-MM-DD] ingest|query|lint|decide | Tiêu đề` (SCHEMA §7).\n> `grep \"^## \\[\" log.md | tail -5`\n\n## [2026-11-02] lint | Khởi tạo wiki (skill llm-wiki, chế độ new)\n\n- Tạo SCHEMA.md, wiki.json, index.md, log.md, OBSIDIAN.md, tools/ (lint, graph, viewer), .obsidian/, khung raw/ và pages/.\n- Tiền tố: chưa có. Code: —. Tài liệu: —.\n\n## [2026-11-02] ingest | raw/specs/initial-requirements.md\n\n- Nạp yêu cầu khởi tạo hệ thống Attendance Portal từ Product Owner.\n- Định nghĩa 10 mã spec thuộc 4 phân hệ: MTG (Điểm danh cuộc họp), CC (Chấm công vào ra), TB (Thiết bị và tích hợp), NV (Tổ chức và nhân sự).\n- Tạo các trang entities (meeting, attendance-record, employee, device), flows (meeting-attendance-flow, daily-attendance-flow), screens (meeting-attendance-screen, attendance-dashboard) và 4 module overview.\n"}, {"path": "pages/entities/attendance-record.md", "title": "Bản ghi điểm danh", "type": "entity", "group": "entities", "fm": {"title": "Bản ghi điểm danh", "type": "entity", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["MTG-02", "MTG-03", "CC-01", "CC-02", "TB-01", "TB-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Bản ghi điểm danh\n\n## Định nghĩa\nThực thể `Bản ghi điểm danh` (Attendance Record) là bản ghi dữ liệu sự kiện bất biến lưu trữ từng lần quẹt thẻ, nhận diện khuôn mặt Face ID hoặc quét vân tay của nhân sự.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| CC-01 | Ghi nhận thời điểm Check-in vào cơ quan đầu ngày, gắn nhãn ca làm việc và trạng thái đi làm đúng giờ / muộn. | Áp dụng cho toàn cơ quan/doanh nghiệp/bệnh viện |\n| CC-02 | Ghi nhận thời điểm Check-out rời cơ quan cuối ngày, tính toán tổng số giờ làm việc thực tế. | Tự động ghép cặp với Check-in gần nhất trong ca |\n| TB-01 | Bản ghi điểm danh qua Hikvision phải lưu kèm phương thức xác thực (Face ID / Vân tay), mã thiết bị và chỉ số tin cậy (confidence score). | Lưu vết nhật ký xác thực thiết bị |\n| TB-02 | Bản ghi điểm danh qua thẻ vật lý phải lưu kèm mã định danh thẻ (Card UID/Badge ID) và mã thiết bị tiếp nhận. | Chống trùng lặp sự kiện trong khoảng thời gian ngắn |\n\n## Quan hệ\n- Thuộc về một [Nhân viên](employee.md).\n- Được ghi nhận từ một [Thiết bị](device.md).\n- Có thể gắn với một [Cuộc họp](meeting.md) nếu sự kiện diễn ra tại phòng họp trong khung giờ họp.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CC-01 | Ghi nhận Check-in vào cơ quan đầu ngày gắn với ca làm việc | Chưa triển khai | MISSING | - |\n| CC-02 | Ghi nhận Check-out rời cơ quan cuối ngày và tổng hợp giờ công | Chưa triển khai | MISSING | - |\n| TB-01 | Tiếp nhận sự kiện điểm danh từ camera Hikvision (Face ID / Vân tay) | Chưa triển khai | MISSING | - |\n| TB-02 | Tiếp nhận sự kiện điểm danh từ quẹt thẻ nhân viên vật lý | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Chấm công vào ra](../overview/module-daily-attendance.md)\n- [Phân hệ Thiết bị và tích hợp](../overview/module-device-integration.md)\n- [Cuộc họp](meeting.md)\n"}, {"path": "pages/entities/device.md", "title": "Thiết bị", "type": "entity", "group": "entities", "fm": {"title": "Thiết bị", "type": "entity", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["TB-01", "TB-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Thiết bị\n\n## Định nghĩa\nThực thể `Thiết bị` (Device) đại diện cho các thiết bị phần cứng đầu cuối thu thập dữ liệu điểm danh, bao gồm camera nhận diện khuôn mặt Hikvision, máy quét vân tay và đầu đọc thẻ thông minh.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| TB-01 | Thiết bị Hikvision truyền tải sự kiện nhận diện qua giao thức ISAPI hoặc webhook thời gian thực kèm mã nhân viên, độ chính xác nhận diện và ảnh chụp log. | Cần cơ chế buffer lưu tạm khi mất kết nối mạng |\n| TB-02 | Đầu đọc thẻ vật lý truyền mã UID thẻ ngay khi nhân viên chạm thẻ vào vùng nhận diện trên thiết bị hoặc camera. | Thời gian phản hồi xác thực dưới 0.5 giây |\n\n## Quan hệ\n- Được lắp đặt tại vị trí cụ thể (Cổng vào cơ quan, cửa phòng họp, cửa xưởng sản xuất).\n- Ghi nhận và gửi về các [Bản ghi điểm danh](attendance-record.md).\n- Kết nối tới phòng họp của [Cuộc họp](meeting.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TB-01 | Tích hợp cổng nhận dữ liệu sự kiện từ Camera / Terminal Hikvision | Chưa triển khai | MISSING | - |\n| TB-02 | Tiếp nhận và giải mã thẻ nhân viên vật lý chạm vào thiết bị | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Thiết bị và tích hợp](../overview/module-device-integration.md)\n- [Bản ghi điểm danh](attendance-record.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n"}, {"path": "pages/entities/employee.md", "title": "Nhân viên", "type": "entity", "group": "entities", "fm": {"title": "Nhân viên", "type": "entity", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["NV-01", "NV-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Nhân viên\n\n## Định nghĩa\nThực thể `Nhân viên` (Employee) đại diện cho cán bộ, công chức, công nhân viên, bác sĩ, y tá hoặc người lao động thuộc tổ chức, có thông tin định danh sinh trắc học và thẻ vật lý trong hệ thống.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| NV-01 | Mỗi nhân viên có mã định danh duy nhất (Employee ID), họ tên, chức danh, phòng ban và các dữ liệu định danh phần cứng (mã thẻ vật lý, Face token Hikvision, mẫu vân tay). | Dữ liệu sinh trắc học được mã hóa an toàn |\n| NV-02 | Cơ cấu tổ chức linh hoạt cho 3 mô hình hoạt động: Cơ quan nhà nước/Uỷ ban phường (Khối/Phòng/Ban), Doanh nghiệp/Nhà máy (Phân xưởng/Tổ đội/Văn phòng), Bệnh viện (Khoa/Phòng khám/Kíp trực). | Hỗ trợ phân quyền đại biểu theo đơn vị |\n\n## Quan hệ\n- Thuộc về phòng ban, đơn vị trong cơ cấu tổ chức.\n- Là chủ thể thực hiện tạo ra [Bản ghi điểm danh](attendance-record.md).\n- Có thể được triệu tập tham dự một hoặc nhiều [Cuộc họp](meeting.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NV-01 | Quản lý hồ sơ nhân viên, mã thẻ và dữ liệu nhận diện thiết bị | Chưa triển khai | MISSING | - |\n| NV-02 | Thiết lập cơ cấu tổ chức đa mô hình (Uỷ ban, Doanh nghiệp/Nhà máy, Bệnh viện) | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Tổ chức và nhân sự](../overview/module-organization.md)\n- [Bản ghi điểm danh](attendance-record.md)\n- [Cuộc họp](meeting.md)\n"}, {"path": "pages/entities/meeting.md", "title": "Cuộc họp", "type": "entity", "group": "entities", "fm": {"title": "Cuộc họp", "type": "entity", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["MTG-01", "MTG-02", "MTG-03", "MTG-04"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Cuộc họp\n\n## Định nghĩa\nThực thể `Cuộc họp` (Meeting) đại diện cho một sự kiện hội họp, hội nghị hoặc buổi giao ban được tổ chức tại một phòng họp cụ thể trong phạm vi cơ quan, xí nghiệp hoặc bệnh viện.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| MTG-01 | Cuộc họp bắt buộc có tiêu đề, phòng họp chỉ định, thời điểm bắt đầu - kết thúc dự kiến và danh sách thành viên được triệu tập. | Hỗ trợ thiết lập người bắt buộc và người tùy chọn |\n| MTG-02 | Khi đại biểu thực hiện Check-in tại phòng họp, hệ thống tự động đối chiếu thời điểm ghi nhận với mốc bắt đầu cuộc họp để gắn nhãn đúng giờ hoặc đi muộn. | Áp dụng ngưỡng dung sai cho phép (ví dụ: trong vòng 5 phút) |\n| MTG-03 | Khi đại biểu thực hiện Check-out hoặc khi cuộc họp kết thúc, hệ thống ghi nhận thời điểm rời phòng họp để tính thời lượng tham gia thực tế. | Kiểm tra về sớm nếu check-out trước khi kết thúc cuộc họp |\n| MTG-04 | Báo cáo chuyên cần cuộc họp tự động tổng hợp danh sách: có mặt đúng giờ, đi muộn, vắng mặt có phép, vắng mặt không phép. | Cập nhật thời gian thực ngay trên màn hình giám sát |\n\n## Quan hệ\n- Thuộc về cơ cấu tổ chức quản lý bởi [Nhân viên](employee.md).\n- Gắn với phòng họp và tiếp nhận dữ liệu từ [Thiết bị](device.md) đặt tại phòng họp.\n- Sinh ra danh sách các [Bản ghi điểm danh](attendance-record.md) loại cuộc họp.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| MTG-01 | Thiết lập và quản lý danh sách cuộc họp, phòng họp, danh sách đại biểu | Chưa triển khai | MISSING | - |\n| MTG-02 | Ghi nhận Check-in cuộc họp qua Face ID, vân tay hoặc thẻ nhân viên | Chưa triển khai | MISSING | - |\n| MTG-03 | Ghi nhận Check-out rời phòng họp và tính toán thời lượng tham dự | Chưa triển khai | MISSING | - |\n| MTG-04 | Báo cáo thống kê chuyên cần cuộc họp thời gian thực | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Phân hệ Điểm danh cuộc họp](../overview/module-meeting.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n- [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md)\n"}, {"path": "pages/flows/daily-attendance-flow.md", "title": "Luồng chấm công vào ra cơ quan", "type": "flow", "group": "flows", "fm": {"title": "Luồng chấm công vào ra cơ quan", "type": "flow", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["CC-01", "CC-02", "TB-01", "TB-02"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Luồng chấm công vào ra cơ quan\n\n## Mục tiêu\nQuản lý chu trình vào và ra cơ quan, doanh nghiệp hoặc bệnh viện của nhân viên trong ngày làm việc, làm cơ sở tổng hợp ngày công và theo dõi kỷ luật lao động.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Nhân viên | Cổng chính / Cửa văn phòng | Quẹt thẻ nhân viên hoặc nhận diện Face ID / Vân tay tại thiết bị Hikvision | Thiết bị xác nhận thông tin nhân sự | CC-01, TB-01, TB-02 |\n| 2 | Hệ thống | Cổng dịch vụ nền | Tiếp nhận sự kiện, xác định đây là lần Check-in đầu tiên trong ngày | Ghi nhận giờ đến cơ quan, gắn ca làm việc tương ứng | CC-01 |\n| 3 | Nhân viên | Cổng chính / Cửa văn phòng | Quẹt thẻ hoặc nhận diện Face ID khi ra về hết ca làm việc | Thiết bị xác nhận giờ rời cơ quan | CC-02, TB-01, TB-02 |\n| 4 | Hệ thống | Cổng dịch vụ nền | Đối chiếu mốc Check-in và Check-out để tính tổng giờ làm việc thực tế | Cập nhật báo cáo chấm công ngày, ghi nhận về sớm/đủ giờ/tăng ca | CC-02 |\n\n## Quy tắc chặn / validation\n- Nhân viên vào/ra nhiều lần trong ngày: Mốc Check-in sớm nhất được tính là giờ vào ca; mốc Check-out trễ nhất được tính là giờ tan ca (hoặc ghi nhận từng lượt vào ra giữa giờ tùy cấu hình đơn vị).\n- Thiết bị ngoại tuyến (offline): Khi mất kết nối internet/mạng nội bộ, thiết bị Hikvision lưu trữ bản ghi vào bộ nhớ đệm và tự động đồng bộ khi khôi phục mạng.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CC-01 | Ghi nhận Check-in đầu ngày gắn ca làm việc | Chưa triển khai | MISSING | - |\n| CC-02 | Ghi nhận Check-out cuối ngày và tính giờ công | Chưa triển khai | MISSING | - |\n| TB-01 | Thu nhận tín hiệu Face ID/Vân tay tại cổng cơ quan | Chưa triển khai | MISSING | - |\n| TB-02 | Thu nhận tín hiệu quẹt thẻ vật lý tại cổng cơ quan | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Bảng điều khiển điểm danh](../screens/attendance-dashboard.md)\n- [Thiết bị](../entities/device.md)\n"}, {"path": "pages/flows/meeting-attendance-flow.md", "title": "Luồng điểm danh cuộc họp", "type": "flow", "group": "flows", "fm": {"title": "Luồng điểm danh cuộc họp", "type": "flow", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["MTG-01", "MTG-02", "MTG-03", "MTG-04"], "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Luồng điểm danh cuộc họp\n\n## Mục tiêu\nTự động hóa toàn bộ quy trình ghi nhận đại biểu tham gia cuộc họp bằng camera nhận diện khuôn mặt Hikvision, vân tay hoặc thẻ nhân viên vật lý; giám sát trạng thái hiện diện và xuất báo cáo chuyên cần thời gian thực.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Thư ký / Quản trị | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) | Tạo cuộc họp, chọn phòng họp, nhập danh sách đại biểu tham dự | Cuộc họp ở trạng thái sẵn sàng đón đại biểu | MTG-01 |\n| 2 | Đại biểu / Nhân viên | Thiết bị Hikvision / Đầu đọc thẻ tại phòng họp | Đứng trước camera (Face ID), quét vân tay hoặc chạm thẻ nhân viên | Thiết bị nhận diện và phát âm thanh/đèn báo thành công | MTG-02 |\n| 3 | Hệ thống | Cổng dịch vụ nền | Nhận diện dữ liệu, đối soát với danh sách đại biểu, ghi nhận thời gian vào | Tạo bản ghi Check-in cuộc họp, cập nhật trạng thái đúng giờ/muộn | MTG-02 |\n| 4 | Đại biểu / Nhân viên | Thiết bị Hikvision tại cửa ra phòng họp | Xác thực khi tan họp hoặc ra ngoài phòng họp | Thiết bị ghi nhận mốc thời gian rời đi | MTG-03 |\n| 5 | Hệ thống / Quản trị | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) | Kết thúc cuộc họp và xem tổng kết | Hiển thị bảng thống kê: có mặt, vắng mặt, muộn, thời lượng tham gia | MTG-04 |\n\n## Quy tắc chặn / validation\n- Nhân viên không nằm trong danh sách triệu tập khi quét thẻ/khuôn mặt vẫn được lưu nhận diện nhưng đánh dấu trạng thái \"Khách mời / Đại biểu ngoài danh sách\".\n- Ngăn chặn ghi nhận trùng lặp: Nếu cùng 1 nhân viên quét liên tiếp trong vòng 60 giây tại cùng 1 thiết bị, hệ thống chỉ giữ bản ghi đầu tiên.\n- Khung thời gian Check-in hợp lệ: Mở trước giờ họp 30 phút cho đến khi kết thúc cuộc họp.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| MTG-01 | Thiết lập cuộc họp và danh sách đại biểu tham dự | Chưa triển khai | MISSING | - |\n| MTG-02 | Xử lý sự kiện Check-in phòng họp từ Hikvision / Thẻ | Chưa triển khai | MISSING | - |\n| MTG-03 | Xử lý sự kiện Check-out phòng họp và tính thời gian tham gia | Chưa triển khai | MISSING | - |\n| MTG-04 | Tổng hợp dữ liệu chuyên cần và xuất báo cáo cuộc họp | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Cuộc họp](../entities/meeting.md)\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md)\n"}, {"path": "pages/overview/module-daily-attendance.md", "title": "Chấm công vào ra", "type": "overview", "group": "overview", "fm": {"title": "Chấm công vào ra", "type": "overview", "sources": ["pages/sources/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Chấm công vào ra\n\n## Tóm tắt\nPhân hệ **Chấm công vào ra** (mã spec `CC-NN`) quản lý việc ghi nhận thời điểm nhân sự đến cơ quan lần đầu trong ngày (Check-in) và thời điểm ra về hết giờ làm việc (Check-out) qua thiết bị Hikvision hoặc quẹt thẻ, phục vụ quản lý kỷ luật lao động và tổng hợp ngày công.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Yêu cầu khởi tạo](../sources/initial-requirements.md) |\n| Thực thể | [Bản ghi điểm danh](../entities/attendance-record.md) · [Nhân viên](../entities/employee.md) |\n| Luồng | [Luồng chấm công vào ra cơ quan](../flows/daily-attendance-flow.md) |\n| Màn hình | [Bảng điều khiển điểm danh](../screens/attendance-dashboard.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Thiết bị và tích hợp](module-device-integration.md)\n- [Phân hệ Tổ chức và nhân sự](module-organization.md)\n"}, {"path": "pages/overview/module-device-integration.md", "title": "Thiết bị và tích hợp", "type": "overview", "group": "overview", "fm": {"title": "Thiết bị và tích hợp", "type": "overview", "sources": ["pages/sources/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Thiết bị và tích hợp\n\n## Tóm tắt\nPhân hệ **Thiết bị và tích hợp** (mã spec `TB-NN`) phụ trách kết nối, đồng bộ và tiếp nhận dữ liệu thời gian thực từ camera nhận diện khuôn mặt Hikvision, máy quét vân tay và đầu đọc thẻ nhân viên vật lý (RFID/NFC).\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Yêu cầu khởi tạo](../sources/initial-requirements.md) |\n| Thực thể | [Thiết bị](../entities/device.md) · [Bản ghi điểm danh](../entities/attendance-record.md) |\n| Luồng | [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md) · [Luồng chấm công vào ra](../flows/daily-attendance-flow.md) |\n| Màn hình | [Bảng điều khiển điểm danh](../screens/attendance-dashboard.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Điểm danh cuộc họp](module-meeting.md)\n- [Phân hệ Chấm công vào ra](module-daily-attendance.md)\n"}, {"path": "pages/overview/module-meeting.md", "title": "Điểm danh cuộc họp", "type": "overview", "group": "overview", "fm": {"title": "Điểm danh cuộc họp", "type": "overview", "sources": ["pages/sources/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Điểm danh cuộc họp\n\n## Tóm tắt\nPhân hệ **Điểm danh cuộc họp** (mã spec `MTG-NN`) là trọng tâm ưu tiên số 1 của hệ thống Attendance Portal. Phân hệ phụ trách lên lịch cuộc họp, ghi nhận đại biểu tham dự qua camera Hikvision (Face ID, Vân tay) hoặc thẻ nhân viên vật lý, tính toán thời gian tham dự và tổng hợp báo cáo chuyên cần thời gian thực.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Yêu cầu khởi tạo](../sources/initial-requirements.md) |\n| Thực thể | [Cuộc họp](../entities/meeting.md) · [Bản ghi điểm danh](../entities/attendance-record.md) |\n| Luồng | [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md) |\n| Màn hình | [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Thiết bị và tích hợp](module-device-integration.md)\n- [Phân hệ Tổ chức và nhân sự](module-organization.md)\n"}, {"path": "pages/overview/module-organization.md", "title": "Tổ chức và nhân sự", "type": "overview", "group": "overview", "fm": {"title": "Tổ chức và nhân sự", "type": "overview", "sources": ["pages/sources/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Tổ chức và nhân sự\n\n## Tóm tắt\nPhân hệ **Tổ chức và nhân sự** (mã spec `NV-NN`) quản lý cơ cấu đơn vị, phòng ban và danh sách nhân sự của cơ quan, doanh nghiệp hoặc bệnh viện; quản lý ánh xạ định danh sinh trắc học (mã khuôn mặt, vân tay) và mã thẻ vật lý cho từng nhân viên.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Nguồn | [Yêu cầu khởi tạo](../sources/initial-requirements.md) |\n| Thực thể | [Nhân viên](../entities/employee.md) |\n| Luồng | [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md) |\n| Màn hình | [Bảng điều khiển điểm danh](../screens/attendance-dashboard.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Điểm danh cuộc họp](module-meeting.md)\n- [Phân hệ Chấm công vào ra](module-daily-attendance.md)\n"}, {"path": "pages/overview/project-overview.md", "title": "Tổng quan Attendance Portal", "type": "overview", "group": "overview", "fm": {"title": "Tổng quan Attendance Portal", "type": "overview", "sources": ["pages/sources/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Tổng quan Attendance Portal\n\n## Tóm tắt\nHệ thống **Attendance Portal** (Cổng Quản trị Điểm danh & Chấm công) do Finviet phát triển là nền tảng quản trị sự hiện diện tự động hóa dành cho các cơ quan nhà nước / UBND xã phường, công ty xí nghiệp / nhà máy sản xuất, và bệnh viện. Hệ thống tích hợp camera Hikvision (Face ID, vân tay) và quẹt thẻ nhân viên vật lý để tự động ghi nhận điểm danh cuộc họp (trọng tâm P0) và chấm công vào ra cơ quan.\n\n## Bản đồ\n\n| Tiền tố | Phân hệ | Mô tả |\n|---|---|---|\n| `MTG` | [Điểm danh cuộc họp](module-meeting.md) | Quản lý hội họp, check-in/out phòng họp, chuyên cần thời gian thực |\n| `CC` | [Chấm công vào ra](module-daily-attendance.md) | Ghi nhận giờ đến và giờ về trong ngày, tính tổng giờ làm việc |\n| `TB` | [Thiết bị và tích hợp](module-device-integration.md) | Kết nối camera Hikvision (Face ID, vân tay) và đầu đọc thẻ vật lý |\n| `NV` | [Tổ chức và nhân sự](module-organization.md) | Cơ cấu phòng ban, hồ sơ nhân sự và định danh thiết bị |\n\n## Liên quan\n\n- [Danh mục wiki](../../index.md)\n- [SCHEMA](../../SCHEMA.md)\n- [Nguồn yêu cầu khởi tạo](../sources/initial-requirements.md)\n"}, {"path": "pages/screens/attendance-dashboard.md", "title": "Bảng điều khiển điểm danh", "type": "screen", "group": "screens", "fm": {"title": "Bảng điều khiển điểm danh", "type": "screen", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["CC-01", "CC-02", "MTG-04", "TB-01"], "apps": ["web"], "route_ids": ["/dashboard"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Bảng điều khiển điểm danh\n\n## Mục đích\nMàn hình trung tâm dành cho Quản lý nhân sự, Ban giám đốc hoặc Trực ban cơ quan theo dõi toàn bộ tình hình hiện diện của cơ quan: số lượng nhân viên đã vào cơ quan trong ngày, các cuộc họp đang diễn ra và trạng thái kết nối của các thiết bị Hikvision.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/dashboard` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CC-01 | Thống kê số lượng nhân viên đã Check-in trong ngày theo phòng ban | MISSING |\n| CC-02 | Thống kê số lượng nhân viên đã Check-out tan ca hoặc đang trong cơ quan | MISSING |\n| MTG-04 | Widget danh sách các cuộc họp đang diễn ra trong ngày kèm tỷ lệ hiện diện | MISSING |\n| TB-01 | Widget theo dõi trạng thái online/offline của các camera Hikvision và đầu đọc thẻ | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CC-01 | Widget thống kê check-in đầu ngày theo phòng ban | Chưa triển khai | MISSING | - |\n| CC-02 | Widget thống kê check-out và tổng quan hiện diện | Chưa triển khai | MISSING | - |\n| MTG-04 | Widget hiển thị các cuộc họp đang diễn ra | Chưa triển khai | MISSING | - |\n| TB-01 | Giám sát trạng thái thiết bị ngoại vi | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Luồng chấm công vào ra cơ quan](../flows/daily-attendance-flow.md)\n- [Màn hình điểm danh cuộc họp](meeting-attendance-screen.md)\n- [Thiết bị](../entities/device.md)\n"}, {"path": "pages/screens/meeting-attendance-screen.md", "title": "Màn hình điểm danh cuộc họp", "type": "screen", "group": "screens", "fm": {"title": "Màn hình điểm danh cuộc họp", "type": "screen", "sources": ["pages/sources/initial-requirements.md"], "spec_ids": ["MTG-01", "MTG-02", "MTG-03", "MTG-04"], "apps": ["web"], "route_ids": ["/meetings/attendance"], "status": "missing", "updated": "2026-11-02"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Màn hình điểm danh cuộc họp\n\n## Mục đích\nMàn hình phục vụ người chủ trì cuộc họp, thư ký hoặc ban tổ chức theo dõi danh sách đại biểu hiện diện trực tiếp tại phòng họp theo thời gian thực (kèm ảnh chụp và phương thức xác thực), điểm danh bổ sung thủ công nếu cần và xuất biên bản chuyên cần ngay khi tan họp.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/meetings/attendance` | - |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| MTG-01 | Chọn cuộc họp đang diễn ra, hiển thị thông tin phòng họp và thời gian | MISSING |\n| MTG-02 | Hiển thị bảng đại biểu tham dự, cập nhật trạng thái \"Đã vào họp\" kèm ảnh Face ID / phương thức thẻ ngay khi có sự kiện | MISSING |\n| MTG-03 | Hiển thị trạng thái \"Đã ra ngoài / Tan họp\" khi đại biểu check-out | MISSING |\n| MTG-04 | Widget thống kê trực quan tỷ lệ chuyên cần (% tham dự, số người vắng mặt, số người đi muộn) và nút xuất báo cáo Excel/PDF | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| MTG-01 | Giao diện chọn và theo dõi cuộc họp | Chưa triển khai | MISSING | - |\n| MTG-02 | Widget hiển thị sự kiện check-in thời gian thực | Chưa triển khai | MISSING | - |\n| MTG-03 | Widget hiển thị sự kiện check-out thời gian thực | Chưa triển khai | MISSING | - |\n| MTG-04 | Widget thống kê tỷ lệ chuyên cần và xuất báo cáo | Chưa triển khai | MISSING | - |\n\n## Liên quan\n- [Cuộc họp](../entities/meeting.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n- [Bảng điều khiển điểm danh](attendance-dashboard.md)\n"}, {"path": "pages/sources/initial-requirements.md", "title": "Yêu cầu khởi tạo Attendance Portal", "type": "source", "group": "sources", "fm": {"title": "Yêu cầu khởi tạo Attendance Portal", "type": "source", "sources": ["raw/specs/initial-requirements.md"], "updated": "2026-11-02"}, "gap": {}, "open": 0, "body": "# Yêu cầu khởi tạo Attendance Portal\n\n## Thông tin nguồn\n| Trường | Giá trị |\n|---|---|\n| Đường dẫn | `raw/specs/initial-requirements.md` |\n| Người cung cấp | Product Owner |\n| Ngày | 2026-11-02 |\n| Loại | PRD / Yêu cầu khởi tạo |\n\n## Nội dung chính\n- Xác định phạm vi nghiệp vụ của Attendance Portal áp dụng cho: Uỷ ban nhân dân cấp phường, cơ quan hành chính nhà nước; công ty doanh nghiệp, nhà máy; bệnh viện (loại trừ trường học).\n- Xác lập 2 phân hệ chấm công:\n  1. Điểm danh cuộc họp trong giờ làm việc (ưu tiên triển khai trước).\n  2. Chấm công vào/ra cơ quan hàng ngày.\n- Tích hợp thiết bị thu thập dữ liệu phần cứng: Camera Hikvision (Face ID, Vân tay) và Thẻ nhân viên vật lý.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Quy tắc (kiểm được) | Nguồn (dòng/mục) |\n|---|---|---|\n| MTG-01 | Quản lý thiết lập thông tin cuộc họp (chủ đề, phòng họp, thời gian bắt đầu, kết thúc, danh sách đại biểu dự kiến) | §2 |\n| MTG-02 | Ghi nhận Check-in vào cuộc họp qua Face ID, Vân tay hoặc Thẻ vật lý, lưu vết mốc thời gian và độ tin cậy | §2, §3 |\n| MTG-03 | Ghi nhận Check-out rời phòng họp khi tan họp hoặc ra ngoài giữa giờ | §2 |\n| MTG-04 | Tổng hợp báo cáo hiện diện cuộc họp thời gian thực (đúng giờ, muộn, vắng mặt không phép/có phép) | §2 |\n| CC-01 | Ghi nhận Check-in vào cơ quan đầu ngày qua thiết bị phần cứng gắn với ca làm việc | §2, §3 |\n| CC-02 | Ghi nhận Check-out rời cơ quan tan ca làm việc và đối soát tổng thời gian hiện diện | §2, §3 |\n| TB-01 | Tiếp nhận và xử lý tín hiệu điểm danh từ Camera Hikvision (nhận diện khuôn mặt Face ID và Vân tay) | §3 |\n| TB-02 | Tiếp nhận và xác thực mã định danh thẻ nhân viên vật lý (RFID/NFC) quẹt tại thiết bị | §3 |\n| NV-01 | Quản lý hồ sơ nhân viên cùng thông tin ánh xạ nhận diện (mã thẻ, khuôn mặt, mẫu vân tay) | §1, §3 |\n| NV-02 | Quản lý cơ cấu phòng ban và loại hình đơn vị (Cơ quan hành chính, Doanh nghiệp/Nhà máy, Bệnh viện) | §1 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Không mâu thuẫn. Phân hệ Điểm danh cuộc họp (`MTG`) là trọng tâm ưu tiên số 1 cần thi công và hoàn thiện trước phân hệ Chấm công vào ra hàng ngày (`CC`).\n\n## Trang chịu ảnh hưởng\n- [Cuộc họp](../entities/meeting.md)\n- [Bản ghi điểm danh](../entities/attendance-record.md)\n- [Nhân viên](../entities/employee.md)\n- [Thiết bị](../entities/device.md)\n- [Luồng điểm danh cuộc họp](../flows/meeting-attendance-flow.md)\n- [Luồng chấm công hàng ngày](../flows/daily-attendance-flow.md)\n- [Màn hình điểm danh cuộc họp](../screens/meeting-attendance-screen.md)\n- [Bảng điều khiển điểm danh](../screens/attendance-dashboard.md)\n"}], "edges": [[0, 1], [0, 2], [1, 10], [1, 11], [1, 12], [1, 13], [2, 0], [2, 1], [2, 3], [2, 4], [2, 5], [2, 6], [2, 7], [2, 8], [2, 9], [2, 10], [2, 11], [2, 12], [2, 13], [2, 14], [2, 15], [2, 16], [2, 17], [4, 5], [4, 6], [4, 7], [4, 10], [4, 11], [5, 4], [5, 7], [5, 9], [5, 11], [6, 4], [6, 7], [6, 13], [7, 4], [7, 5], [7, 6], [7, 9], [7, 12], [7, 16], [8, 4], [8, 5], [8, 15], [9, 4], [9, 7], [9, 16], [10, 4], [10, 6], [10, 8], [10, 11], [10, 13], [10, 14], [10, 15], [10, 17], [11, 4], [11, 5], [11, 8], [11, 9], [11, 10], [11, 12], [11, 14], [11, 15], [11, 17], [12, 4], [12, 7], [12, 9], [12, 11], [12, 13], [12, 14], [12, 16], [12, 17], [13, 6], [13, 9], [13, 10], [13, 12], [13, 14], [13, 15], [13, 17], [14, 1], [14, 2], [14, 10], [14, 11], [14, 12], [14, 13], [14, 17], [15, 5], [15, 8], [15, 16], [16, 7], [16, 9], [16, 15], [17, 4], [17, 5], [17, 6], [17, 7], [17, 8], [17, 9], [17, 15], [17, 16]]};
const COLORS={overview:'#e2552f',flows:'#f29b2b',screens:'#3b82f6',entities:'#3fa35b',concepts:'#9b5de5',sources:'#8f8f88',proposals:'#14a3a3',contracts:'#b07a4f',root:'#444'};
const NAMES={overview:'Tổng quan',flows:'Luồng',screens:'Màn hình',entities:'Thực thể',concepts:'Khái niệm',sources:'Nguồn',proposals:'Đề xuất (harness)',contracts:'Contract',root:'Điều hướng'};
const LEVELS=['MISSING','PARTIAL','CONTRADICTS','BUG','EXTRA','OK','STALE','WRONG','PLANNED'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;
let HUBMIN=1e9,OUT=[],IN=[],dirty=true,N=[],E=[],adj=[],byPath={},hidden=new Set(),sel=-1,hov=-1,view={x:0,y:0,k:1},alpha=1,drag=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resolve(from,href){const parts=from.split('/');parts.pop();for(const seg of href.split('/')){if(seg==='..')parts.pop();else if(seg&&seg!=='.')parts.push(seg)}return parts.join('/')}
function inline(t,from){t=esc(t);
 t=t.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
 t=t.replace(/!\[([^\]]*)\]\([^)]*\)/g,'[$1]');
 t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{href=href.replace(/&amp;/g,'&');
   if(/^https?:\/\//.test(href))return '<a href="'+esc(href)+'" target="_blank" rel="noopener">'+txt+'</a>';
   const p=resolve(from,decodeURIComponent(href.split('#')[0]));return byPath[p]!==undefined?'<a href="#'+encodeURIComponent(p)+'">'+txt+'</a>':'<span title="'+esc(href)+'">'+txt+'</span>'});
 t=t.replace(/\[\[([^\]|#]+)[^\]]*\]\]/g,(m,x)=>{const p=byPath['pages/'+x.trim()]!==undefined?'pages/'+x.trim():(byPath[x.trim()]!==undefined?x.trim():null);return p?'<a href="#'+encodeURIComponent(p)+'">'+esc(x.trim())+'</a>':m});
 t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
 t=t.replace(/\[CẦN LÀM RÕ\]|\[CHƯA KIỂM CODE\]/g,m=>'<span class="oq">'+m+'</span>');
 return t}
function md(src,from){const L=src.split('\n'),out=[];let i=0;
 while(i<L.length){let l=L[i];
  if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
  let m=l.match(/^(#{1,6})\s+(.*)$/);if(m){out.push('<h'+m[1].length+'>'+inline(m[2],from)+'</h'+m[1].length+'>');i++;continue}
  if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);let h='<table>';
   rows.forEach((r,ri)=>{if(/^\s*\|[\s:|-]+\|\s*$/.test(r))return;const cells=r.trim().replace(/^\||\|$/g,'').split('|');const tg=ri===0?'th':'td';
    h+='<tr>'+cells.map(c=>{c=c.trim();const k=c.replace(/[`*]/g,'');return '<'+tg+'>'+(LEVELS.includes(k)?'<span class="tag L-'+k+'">'+k+'</span>':inline(c,from))+'</'+tg+'>'}).join('')+'</tr>'});
   out.push(h+'</table>');continue}
  if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ord=/^\s*\d+\./.test(l),items=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i]))items.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
   out.push((ord?'<ol>':'<ul>')+items.map(x=>'<li>'+inline(x,from)+'</li>').join('')+(ord?'</ol>':'</ul>'));continue}
  if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote>'+inline(b.join(' '),from)+'</blockquote>');continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push('<hr>');i++;continue}
  if(!l.trim()){i++;continue}
  const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|```|\s*\||\s*([-*]|\d+\.)\s+|>)/.test(L[i]))p.push(L[i++]);out.push('<p>'+inline(p.join(' '),from)+'</p>')}
 return out.join('\n')}
function setup(d){DATA=d;const m=d.meta;
 document.getElementById('wname').textContent='LLM Wiki · '+(m.name||'');document.title='Wiki viewer · '+(m.name||'');
 document.getElementById('wmeta').textContent=m.pages+' trang · '+m.links+' link · chế độ '+m.mode+(LIVE?' · trực tiếp':' · tạo lúc '+m.generated);
 const g=Object.assign({},m.gaps.gap||{},m.gaps.doc||{});document.getElementById('wgaps').innerHTML=Object.keys(g).filter(k=>k!=='OK').map(k=>'<span class="tag L-'+k+'">'+k+' '+g[k]+'</span>').join('')+(m.open?'<span class="tag oq">câu hỏi mở '+m.open+'</span>':'');
 const old={};N.forEach(n=>old[n.path]=n);byPath={};
 N=d.nodes.map((n,i)=>{byPath[n.path]=i;const o=old[n.path],a=i*2.399;return Object.assign(n,{i,x:o?o.x:Math.cos(a)*(30+i*2),y:o?o.y:Math.sin(a)*(30+i*2),vx:0,vy:0,deg:0})});
 E=d.edges.filter(e=>N[e[0]]&&N[e[1]]);adj=N.map(()=>new Set());OUT=N.map(()=>[]);IN=N.map(()=>[]);E.forEach(([a,b])=>{adj[a].add(b);adj[b].add(a);OUT[a].push(b);IN[b].push(a);N[b].deg++});
 N.forEach(n=>n.r=3+Math.sqrt(n.deg)*1.7);HUBMIN=(N.map(n=>n.deg).sort((a,b)=>b-a)[11])||1e9;
 const counts={};N.forEach(n=>counts[n.group]=(counts[n.group]||0)+1);
 document.getElementById('groups').innerHTML=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(k=>'<div class="grp'+(hidden.has(k)?' off':'')+'" data-g="'+k+'"><span class="dot" style="background:'+(COLORS[k]||'#888')+'"></span>'+(NAMES[k]||k)+'<span class="n">'+counts[k]+'</span></div>').join('');
 alpha=1;route();if(!Object.keys(old).length){const t0=performance.now();for(let t=0;t<220&&performance.now()-t0<700;t++)tick();alpha=Math.max(alpha,.2);fit()}dirty=true}
function visible(n){if(hidden.has(n.group))return false;if(document.getElementById('local').checked&&sel>=0)return n.i===sel||adj[sel].has(n.i);return true}
function tick(){if(alpha<0.02)return;const vis=N.filter(visible),k=60,C=120,grid=new Map();
 /* lực đẩy theo lưới không gian: chỉ xét node trong ô lân cận (bán kính C) → gần O(n) thay vì O(n²) */
 vis.forEach(n=>{const key=Math.floor(n.x/C)+','+Math.floor(n.y/C);let c=grid.get(key);if(!c)grid.set(key,c=[]);c.push(n)});
 vis.forEach(p=>{const gx=Math.floor(p.x/C),gy=Math.floor(p.y/C);for(let ix=gx-1;ix<=gx+1;ix++)for(let iy=gy-1;iy<=gy+1;iy++){const c=grid.get(ix+','+iy);if(!c)continue;
  for(const q of c){if(q.i<=p.i)continue;let dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy;if(d2>C*C)continue;if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}
   const d=Math.sqrt(d2),f=Math.min(k*k/d2,4)*alpha*.5;p.vx+=dx/d*f;p.vy+=dy/d*f;q.vx-=dx/d*f;q.vy-=dy/d*f}}});
 E.forEach(([a,b])=>{const p=N[a],q=N[b];if(!visible(p)||!visible(q))return;const dx=q.x-p.x,dy=q.y-p.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-k)/d*.02*alpha;p.vx+=dx*f;p.vy+=dy*f;q.vx-=dx*f;q.vy-=dy*f});
 vis.forEach(n=>{n.vx-=n.x*.002*alpha;n.vy-=n.y*.002*alpha;if(drag&&drag.n===n)return;const v=Math.hypot(n.vx,n.vy);if(v>8){n.vx*=8/v;n.vy*=8/v}n.x+=n.vx;n.y+=n.vy;n.vx*=.6;n.vy*=.6});alpha*=.99}
function color(n){return COLORS[n.group]||'#888'}
function draw(){requestAnimationFrame(draw);const moving=alpha>=0.02;tick();if(!moving&&!dirty)return;dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.translate(W/2+view.x,H/2+view.y);ctx.scale(view.k,view.k);
 const css=getComputedStyle(document.documentElement),focus=hov>=0?hov:sel;
 ctx.lineWidth=1/view.k;E.forEach(([a,b])=>{const p=N[a],q=N[b];if(!visible(p)||!visible(q))return;const on=focus>=0&&(a===focus||b===focus);ctx.strokeStyle=on?css.getPropertyValue('--hl'):css.getPropertyValue('--edge');ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()});
 N.forEach(n=>{if(!visible(n))return;const dim=focus>=0&&n.i!==focus&&!adj[focus].has(n.i);ctx.globalAlpha=dim?.25:1;ctx.fillStyle=color(n);ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();
  if(n.i===sel){ctx.strokeStyle=css.getPropertyValue('--ink');ctx.lineWidth=2/view.k;ctx.stroke()}});
 ctx.globalAlpha=1;ctx.fillStyle=css.getPropertyValue('--ink');ctx.font=(12/view.k)+'px -apple-system,sans-serif';
 N.forEach(n=>{if(!visible(n))return;const near=focus>=0&&(n.i===focus||adj[focus].has(n.i));if(view.k>1.8||near||(focus<0&&n.deg>=HUBMIN))ctx.fillText(n.title.slice(0,40),n.x+n.r+2/view.k,n.y+4/view.k)})}
function toWorld(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-W/2-view.x)/view.k,y:(ev.clientY-r.top-H/2-view.y)/view.k}}
function hit(ev){const p=toWorld(ev);let best=-1,bd=1e9;N.forEach(n=>{if(!visible(n))return;const d=(n.x-p.x)**2+(n.y-p.y)**2;if(d<(n.r+4/view.k)**2&&d<bd){bd=d;best=n.i}});return best}
function resize(){dirty=true;dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
function fit(){const vis=N.filter(visible);if(!vis.length)return;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;vis.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
 const k=Math.min(W/(x1-x0+80),H/(y1-y0+80),3);view.k=isFinite(k)&&k>0.02?k:0.5;dirty=true;view.x=-(x0+x1)/2*view.k;view.y=-(y0+y1)/2*view.k}
function select(i){sel=i;const d=document.getElementById('detail');if(i<0){d.innerHTML='<div class="muted">Chọn một node.</div>';return}
 const n=N[i],fm=n.fm||{},rows=Object.keys(fm).filter(k=>k!=='title').map(k=>'<tr><td>'+esc(k)+'</td><td>'+esc(Array.isArray(fm[k])?fm[k].join(', '):fm[k])+'</td></tr>').join('');
 const gl=Object.assign({},(n.gap||{}).gap||{},(n.gap||{}).doc||{}),chips=Object.keys(gl).map(k=>'<span class="tag L-'+k+'">'+k+' '+gl[k]+'</span>').join('')+(n.open?'<span class="tag oq">câu hỏi mở '+n.open+'</span>':'');
 dirty=true;const out=OUT[i],inn=IN[i];
 const lst=a=>a.map(j=>'<a href="#'+encodeURIComponent(N[j].path)+'"><span class="dot" style="display:inline-block;width:8px;height:8px;background:'+color(N[j])+'"></span> '+esc(N[j].title)+'</a>').join('')||'<span class="muted">—</span>';
 d.innerHTML='<div class="chips"><span class="tag" style="background:'+color(n)+';color:#fff">'+esc(NAMES[n.group]||n.group)+'</span>'+(n.type?'<span class="tag">type: '+esc(n.type)+'</span>':'')+'</div><h1>'+esc(n.title)+'</h1><div class="path">'+esc(n.path)+'</div>'+
  (chips?'<div class="chips" style="margin-top:8px">'+chips+'</div>':'')+(rows?'<table class="fm">'+rows+'</table>':'')+
  '<div class="links" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0"><div><div class="muted">Link ra ('+out.length+')</div>'+lst(out)+'</div><div><div class="muted">Link vào ('+inn.length+')</div>'+lst(inn)+'</div></div>'+
  '<div class="md" id="mdbody">'+(n.body!==undefined?md(n.body,n.path):(LIVE?'<div class="muted">Đang tải nội dung…</div>':'<div class="muted">Bản lite: không kèm nội dung trang. Dùng <code>wiki_viewer.py --serve</code> hoặc build không có <code>--lite</code>.</div>'))+'</div>';d.scrollTop=0;
 if(n.body===undefined&&LIVE)fetch('body?p='+encodeURIComponent(n.path),{cache:'no-store'}).then(r=>r.json()).then(j=>{n.body=j.body;if(sel===i){const el=document.getElementById('mdbody');if(el)el.innerHTML=md(n.body,n.path)}}).catch(()=>{})}
function route(){const p=decodeURIComponent(location.hash.slice(1));if(byPath[p]!==undefined){select(byPath[p]);const n=N[byPath[p]];if(drag===null&&n){view.x=-n.x*view.k;view.y=-n.y*view.k}}else if(sel>=N.length)select(-1)}
window.addEventListener('hashchange',route);window.addEventListener('resize',resize);
cv.addEventListener('wheel',ev=>{ev.preventDefault();dirty=true;const f=Math.exp(-ev.deltaY*.0015),r=cv.getBoundingClientRect(),mx=ev.clientX-r.left-W/2,my=ev.clientY-r.top-H/2;view.x=mx-(mx-view.x)*f;view.y=my-(my-view.y)*f;view.k*=f},{passive:false});
cv.addEventListener('mousedown',ev=>{const i=hit(ev);drag={n:i>=0?N[i]:null,x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false}});
window.addEventListener('mousemove',ev=>{if(!drag){const h=hit(ev);if(h!==hov){hov=h;dirty=true;cv.style.cursor=h>=0?'pointer':'grab'}return}
 if(Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y)>3)drag.moved=true;if(drag.n){const p=toWorld(ev);drag.n.x=p.x;drag.n.y=p.y;alpha=Math.max(alpha,.3)}else{view.x=drag.vx+ev.clientX-drag.x;view.y=drag.vy+ev.clientY-drag.y}dirty=true});
window.addEventListener('mouseup',ev=>{if(drag&&!drag.moved&&drag.n){const p=drag.n.path;drag=null;location.hash=encodeURIComponent(p);return}drag=null});
document.getElementById('groups').addEventListener('click',ev=>{const g=ev.target.closest('.grp');if(!g)return;const k=g.dataset.g;hidden.has(k)?hidden.delete(k):hidden.add(k);g.classList.toggle('off');alpha=.6;dirty=true});
document.getElementById('local').addEventListener('change',()=>{alpha=.6;setTimeout(fit,400)});
document.getElementById('fit').addEventListener('click',fit);
const q=document.getElementById('q'),res=document.getElementById('results');
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){res.innerHTML='';return}
 res.innerHTML=N.filter(n=>(n.title+' '+n.path).toLowerCase().includes(s)).slice(0,30).map(n=>'<div data-p="'+esc(n.path)+'"><span class="dot" style="display:inline-block;width:8px;height:8px;background:'+color(n)+'"></span> '+esc(n.title)+'</div>').join('')||'<div class="muted">Không thấy</div>'});
q.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=res.querySelector('[data-p]');if(f)location.hash=encodeURIComponent(f.dataset.p)}});
res.addEventListener('click',ev=>{const d=ev.target.closest('[data-p]');if(d)location.hash=encodeURIComponent(d.dataset.p)});
async function load(){const r=await fetch('data.json',{cache:'no-store'});setup(await r.json())}
if(LIVE){const b=document.getElementById('reload');b.hidden=false;b.addEventListener('click',load);window.addEventListener('focus',load)}
resize();if(DATA)setup(DATA);else load();requestAnimationFrame(draw);
</script></body></html>
